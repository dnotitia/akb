# OPTIONAL local Keycloak overlay — for developing/testing the route-selected
# Keycloak access-token verifier and the MCP OAuth Resource Server path.
# Browser login/callback/logout/exchange routes are intentionally unavailable
# in the current phase. This overlay is NOT part of the default stack.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.keycloak.yaml up
#
# === Human API access-token path === enable in config/app.yaml (matches the
# imported realm `deploy/keycloak-dev/akb-realm.json` and split URLs):
#
#   auth_mode: sso
#   keycloak_enabled: true
#   keycloak_server_url: "http://localhost:8080"      # browser-facing → issuer
#   keycloak_internal_url: "http://keycloak:8080"     # backend → keycloak container
#   keycloak_realm: "akb"
#   keycloak_client_id: "akb-web"
#   keycloak_verify_ssl: false
#   api_oauth_audience: "http://localhost:8000/api"
#
# Test user (in the imported realm): alice / alice-password (alice@example.com).
# The imported confidential client's fixed dev secret may be used by a test
# client to obtain a token; AKB itself does not consume a browser callback
# secret in this phase.
#
# === MCP OAuth path === additionally:
#
#   mcp_oauth_enabled: true
#   public_base_url: "http://localhost:8000"
#   mcp_oauth_audience: ""    # default → "http://localhost:8000/mcp"
#                             # MUST match the audience baked into the
#                             # akb:vault:* scope mappers in akb-realm.json
#
# To test MCP OAuth while keeping human login local, use `auth_mode: local`
# with the same Keycloak authority + `mcp_oauth_enabled: true`; no human OIDC
# redirect/client settings are required for that resource-server-only mode.
#
# For local E2E (`backend/tests/test_mcp_oauth_e2e.sh`), the `alice` fixture
# uses the `akb-web` direct-access grant to mint a human access token without
# a browser roundtrip. The realm's `akb-mcp-test` service-account client stays
# available for legacy/manual experiments but is intentionally not accepted by
# the human verifier profile.
#
# Real Claude Code / claude.ai validation: the local Keycloak overlay
# works for headless E2E but Claude Code's OAuth discovery requires
# the AS metadata URL to be HTTPS. Easiest path is to point a local
# AKB backend at an already-deployed HTTPS Keycloak realm (e.g. a
# staging instance). See `docs/mcp-clients/web-connectors.md` for the
# walkthrough.
#
# The realm import ships FIXED dev client secrets ("local-akb-dev-secret",
# "local-akb-mcp-test-secret"). Throwaway local values (same spirit as
# the hard-coded `akb` Postgres password in docker-compose.yaml) — never
# reuse them anywhere real.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Public (browser-facing) URL → pins the token `iss` to localhost:8080.
      KC_HOSTNAME: http://localhost:8080
      # Allow server-side (backend→keycloak:8080) calls under a different
      # host than KC_HOSTNAME without rejection.
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./deploy/keycloak-dev:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      # 26.x exposes health on the management port (9000) by default; the
      # realm OIDC discovery doc is a reliable readiness signal on 8080.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo ok"]
      interval: 5s
      timeout: 5s
      retries: 40

  backend:
    # Backend must be able to resolve the `keycloak` service name for the
    # backchannel (token + JWKS) calls.
    depends_on:
      keycloak:
        condition: service_started
