# Keep public backend paths and limits aligned with deploy/k8s/ingress.yaml.
server {
  listen 3000;
  root /usr/share/nginx/html;
  client_max_body_size 500m;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location / { try_files $uri $uri/ /index.html; }

  # Preserve the complete URI (including query strings), bare /mcp and the
  # OAuth discovery prefix. Never return SPA HTML for backend discovery.
  location ~ ^/(api(?:/|$)|mcp(?:/|$)|\.well-known(?:/|$)|health(?:/|$)|livez$|readyz$) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
}
