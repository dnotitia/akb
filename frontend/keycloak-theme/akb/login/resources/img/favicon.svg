  </defs>
  <rect width="64" height="64" rx="23" fill="url(#g)"/>
  <text x="29" y="43" text-anchor="middle" font-family="Pretendard, system-ui, sans-serif" font-size="34" font-weight="600" fill="#ffffff">a</text>
  <circle cx="49" cy="48" r="5" fill="#e55e2c"/>
</svg>
