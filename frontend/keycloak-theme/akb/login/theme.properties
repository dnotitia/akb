# AKB login theme. Inherits every page from keycloak.v2 (PatternFly 5) and
# replaces the page frame plus the pages a person actually meets on AKB's
# paths; see ../../README.md for which pages and why.
parent=keycloak.v2
import=common/keycloak

# PatternFly 5 stays loaded (stylesCommon is inherited) so inherited pages keep
# their structure; akb-login.css maps PatternFly's variables onto the theme
# vocabulary. keycloak.v2's own styles.css is replaced, not extended: it only
# carries Keycloak's background, logo and tooltip colours.
styles=fonts/pretendard/pretendardvariable-dynamic-subset.css css/akb-tokens.generated.css css/akb-vocabulary.css css/akb-login.css
themeInitScript=js/akb-theme-init.js
scripts=js/akb-login.js

darkMode=true
kcDarkModeClass=pf-v5-theme-dark

# Replaced by the content hash when the theme is assembled, so a changed file
# is never served from a browser cache that Keycloak told to keep it 30 days.
assetVersion=dev

# The client attribute that keeps a client's sign-in page to this realm's own
# accounts (AKB's /admin client). Identity-provider buttons are not drawn there.
akbNativeOnlyClientAttribute=akb.login.native-only

# Pages keycloak.v2 inherits from base still name these classes, and
# keycloak.v2 defines none of them, so their buttons render with no variant
# (grey, under-contrast). Give them PatternFly 5's.
kcButtonDefaultClass=pf-m-secondary
kcButtonLargeClass=pf-m-display-lg
kcFormButtonsClass=pf-v5-c-form__actions
