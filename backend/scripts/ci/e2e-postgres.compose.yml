services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: akb
      POSTGRES_PASSWORD: akb  # pragma: allowlist secret
      POSTGRES_DB: akb
    ports:
      - "127.0.0.1:${AKB_E2E_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akb"]
      interval: 5s
      timeout: 5s
      retries: 12
