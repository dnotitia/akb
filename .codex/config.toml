# Coding-agent defaults. Product inference models are configured separately.
# https://developers.openai.com/api/docs/guides/latest-model
model = "gpt-6-astra"
model_reasoning_effort = "medium"
model_verbosity = "low"

[agents]
max_concurrent_threads_per_session = 3
max_depth = 1

[agents.explorer]
description = "Optional bounded read-only lookup; Terra is allowed only at max effort."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "Astra review of consequential changes with concrete, reproducible findings."
config_file = "agents/reviewer.toml"

[agents.efficiency_worker]
description = "Opt-in Sol worker only after comparable tasks demonstrate better total efficiency than Astra."
config_file = "agents/efficiency_worker.toml"
