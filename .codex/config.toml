# Generated from .agents/roles.toml by scripts/agent-roles.py; edit the source.
# No model or reasoning effort is set: each person's own Codex configuration
# chooses them. Product inference models are configured separately.

[agents]
max_concurrent_threads_per_session = 3
max_depth = 1

[agents.explorer]
description = "Bounded read-only lookup that returns paths and evidence, not decisions."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "Read-only review of a named diff with concrete, reproducible findings."
config_file = "agents/reviewer.toml"

[agents.worker]
description = "Bounded implementation on assigned paths, returning the change and the check it ran."
config_file = "agents/worker.toml"
