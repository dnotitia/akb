apiVersion: v1
kind: ConfigMap
metadata:
  name: akb-app-config
  namespace: akb
data:
  # Mounted at /etc/akb/app.yaml. All non-secret runtime config lives here.
  # Defaults match config/app.yaml.example. Override per-environment via
  # `kubectl edit configmap akb-app-config -n akb` or a kustomize overlay
  # under deploy/k8s/internal/.
  app.yaml: |
    db_host: postgres
    db_port: 5432
    db_name: akb
    db_user: akbuser
    git_storage_path: /data/vaults
    tokenizer_processes: 2
    worker_shutdown_timeout_secs: 35

    # Embedding (required) — any OpenAI-compatible /v1/embeddings endpoint.
    # embed_dimensions MUST match the model.
    embed_base_url: https://api.openai.com/v1
    embed_model: text-embedding-3-small
    embed_dimensions: 1536

    # LLM (optional) — used by metadata_worker for auto-tagging external-git
    # imports. Leave blank to disable; core CRUD/search keeps working.
    llm_base_url: ""
    llm_model: ""

    # Reranker (optional) — cross-encoder rescoring of candidates.
    rerank_enabled: false
    rerank_provider: cohere
    rerank_model: cohere/rerank-v3.5
    rerank_prefetch: 30

    # S3-compatible object storage (optional) — leave blank to disable.
    s3_endpoint_url: ""
    s3_bucket: akb-files

    # Required canonical human-login mode. This base deployment is local.
    auth_mode: local
    jwt_algorithm: RS256
    local_session_issuer: https://akb.example.com
    local_session_private_key_path: /etc/akb/local-session/private.pem
    local_session_jwks_path: /etc/akb/local-session/jwks.json

    # Vector store — default driver is pgvector inside the main PG pod
    # (`pgvector/pgvector:pg16` ships with the extension). Override
    # via overlay (deploy/k8s/internal/) to use Qdrant instead.
    vector_store_driver: pgvector
    vector_store_dsn: ""
    vector_store_schema: vector_index
    vector_store_sparse_shape: posting
    vector_url: ""
    vector_collection: chunks

    # Set to your public ingress URL for absolute /p/{slug} publication URLs.
    public_base_url: https://akb.example.com

    # Event stream (optional Redis fanout). Leave blank to disable —
    # PG `events` outbox still works.
    redis_url: ""
    redis_event_stream: akb:events
    redis_stream_maxlen: 100000

---
# akb-secret — produced by the manual, bundled, or external Secret profile and
# never committed. Its `secret.yaml` key is mounted at /etc/akb/secret.yaml.
# Expected configuration payload:
#
#   stringData:
#     secret.yaml: |
#       db_password: <postgres password>
#       system_hmac_secret: <openssl rand -hex 32>
#       # SSO overlay only: independent unpadded base64url-encoded 32 bytes
#       sso_browser_session_encryption_key: <browser-session encryption key>
#       embed_api_key: <provider key>
#       llm_api_key: <provider key>
#       rerank_api_key: <cohere key>
#       vector_api_key: <qdrant api key>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: akb
spec:
  replicas: 1
  # vaultdata PVC is ReadWriteOnce. The default RollingUpdate strategy
  # tries to bring the new pod up before the old one terminates, which
  # fails with Multi-Attach on a single-node-bound EBS volume. Recreate
  # terminates the old pod first, accepts the ~10s downtime window, and
  # avoids the race. Caught when an AWS demo rollout left the new pod
  # Pending for 10+ minutes while the old one held the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: akb-backend
  template:
    metadata:
      labels:
        app: akb-backend
    spec:
      # AKB consumes mounted configuration only. Secret managers and their
      # sync operators own Kubernetes API access; the application pod does not.
      automountServiceAccountToken: false
      # All worker stop signals are broadcast together and joined under the
      # 35-second application deadline. The remaining 10 seconds cover DB/HTTP
      # client close, audit drain, and interpreter teardown before SIGKILL.
      terminationGracePeriodSeconds: 45
      containers:
        - name: backend
          image: akb-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: AKB_PROCESS_ROLE
              value: "api"
            # Serving only tokenizes queries; one child avoids duplicating the
            # worker sidecar's corpus-indexing memory footprint.
            - name: AKB_TOKENIZER_PROCESSES
              value: "1"
          volumeMounts:
            - name: app-config
              mountPath: /etc/akb/app.yaml
              subPath: app.yaml
              readOnly: true
            - name: secret-config
              mountPath: /etc/akb/secret.yaml
              subPath: secret.yaml
              readOnly: true
            - name: local-session-keys
              mountPath: /etc/akb/local-session
              readOnly: true
            - name: vaultdata
              mountPath: /data/vaults
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            # No CPU limit on purpose: cgroup throttling caused /livez to
            # time out under indexing bursts. Cluster has ~98% CPU headroom;
            # revisit if other tenants land on the same node.
            limits:
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          # Readiness gates traffic and MUST stay honest — shed a stalled pod
          # from Service endpoints quickly. Keep failureThreshold small; only
          # widen timeout so a single slow (not dead) /readyz doesn't flap the
          # endpoint. ~3×15s = 45s of sustained unreadiness before removal.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 3
          # Liveness restarts the serving container — with one API replica that
          # is a total serving outage, so it must fire ONLY on a genuinely dead
          # loop, never on a transient multi-second stall (for example a large
          # akb_sql response). Durable indexing now lives in the sidecar. The
          # API loop can still be briefly unschedulable while healthy, so
          # tolerate ~6×30s = 3min before assuming deadlock.
          # (Do NOT rely on a runtime `kubectl patch` — deploy-internal.sh
          # re-applies this manifest and clobbers it; the value must live here.)
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 6
        - name: worker
          image: akb-backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.worker_main"]
          env:
            - name: AKB_PROCESS_ROLE
              value: "worker"
            - name: AKB_TOKENIZER_PROCESSES
              value: "2"
          volumeMounts:
            - name: app-config
              mountPath: /etc/akb/app.yaml
              subPath: app.yaml
              readOnly: true
            - name: secret-config
              mountPath: /etc/akb/secret.yaml
              subPath: secret.yaml
              readOnly: true
            - name: local-session-keys
              mountPath: /etc/akb/local-session
              readOnly: true
            - name: vaultdata
              mountPath: /data/vaults
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
          startupProbe:
            exec:
              command: ["python", "-m", "app.worker_health"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["python", "-m", "app.worker_health"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-m", "app.worker_health"]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: app-config
          configMap:
            name: akb-app-config
        - name: secret-config
          secret:
            # Shared contract with akb-platform-managed workspaces. The
            # producer can be manual, bundled Vault/OpenBao, or an external
            # secret store; the application always consumes this name.
            secretName: akb-secret
        - name: local-session-keys
          secret:
            secretName: akb-secret # pragma: allowlist secret
            defaultMode: 0400
            items:
              - key: local-session-private.pem
                path: private.pem
              - key: local-session-jwks.json
                path: jwks.json
        - name: vaultdata
          persistentVolumeClaim:
            claimName: akb-vaultdata

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: akb-vaultdata
  namespace: akb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: akb
spec:
  selector:
    app: akb-backend
  ports:
    - port: 8000
      targetPort: 8000
