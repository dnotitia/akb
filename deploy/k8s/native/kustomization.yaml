apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: akb
resources:
  - ../postgres.yaml
  - ../backend.yaml
  - ../frontend.yaml
  - ../ingress.yaml

# Generated once, persisted by the operator. Never regenerate the database
# identity or initial-image receipt when updating the workload image.
configMapGenerator:
  - name: akb-app-config
    namespace: akb
    behavior: replace
    files:
      - app.yaml
generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: backend-patch.yaml
  - path: remove-git-pvc.yaml
