apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: akb

resources:
  - ../postgres.yaml
  - ../backend.yaml
  - ../frontend.yaml
  - ../ingress.yaml

# Vector store: default driver is pgvector running inside the main
# Postgres pod (`postgres.yaml` already uses the pgvector/pgvector
# image, so the extension is available; backend creates its own
# `vector_index` schema). To run Qdrant as a separate StatefulSet,
# compose it from an operator overlay and patch the backend ConfigMap.

# Redis event fanout is optional and disabled in the base app ConfigMap. Add
# `redis.yaml` from an operator overlay only when the OT Redis Operator CRD is
# installed and `redis_url` is configured.

# No namespace or cluster-scoped object is part of the base. The profile
# deployer or the operator owns the target namespace explicitly.
