# Production baseline. HashiCorp Vault is fetched from the official Helm/image
# distribution and remains subject to its BSL terms. The installer requires a
# namespace-local `akb-secret-store-tls` Secret. Initialization/unseal remains
# explicit; use a private extra values file for KMS auto-unseal credentials.
global:
  enabled: true
  tlsDisable: false

injector:
  enabled: false

server:
  standalone:
    enabled: false
  dev:
    enabled: false
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 0
          tls_cert_file = "/vault/tls/tls.crt"
          tls_key_file = "/vault/tls/tls.key"
          tls_client_ca_file = "/vault/tls/ca.crt"
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}
  dataStorage:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
  auditStorage:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  extraEnvironmentVars:
    VAULT_CACERT: /vault/tls/ca.crt
  volumes:
    - name: tls
      secret:
        secretName: akb-secret-store-tls
  volumeMounts:
    - name: tls
      mountPath: /vault/tls
      readOnly: true
  serviceAccount:
    create: true
  authDelegator:
    enabled: true

ui:
  enabled: false

csi:
  enabled: false
