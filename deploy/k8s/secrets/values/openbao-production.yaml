# Production baseline. The installer refuses to use this profile until a
# namespace-local `akb-secret-store-tls` Secret containing tls.crt, tls.key,
# and ca.crt exists. Initialization/unseal remains an explicit operator
# ceremony; an additional private values file may configure a supported KMS
# seal without committing credentials here.
global:
  enabled: true
  tlsDisable: false

injector:
  enabled: false

server:
  standalone:
    enabled: false
  dev:
    enabled: false
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 0
          tls_cert_file = "/openbao/tls/tls.crt"
          tls_key_file = "/openbao/tls/tls.key"
          tls_client_ca_file = "/openbao/tls/ca.crt"
        }
        storage "raft" {
          path = "/openbao/data"
        }
        service_registration "kubernetes" {}
  dataStorage:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
  auditStorage:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  extraEnvironmentVars:
    BAO_CACERT: /openbao/tls/ca.crt
  volumes:
    - name: tls
      secret:
        secretName: akb-secret-store-tls
  volumeMounts:
    - name: tls
      mountPath: /openbao/tls
      readOnly: true
  serviceAccount:
    create: true
  authDelegator:
    enabled: true

ui:
  enabled: false

csi:
  enabled: false
