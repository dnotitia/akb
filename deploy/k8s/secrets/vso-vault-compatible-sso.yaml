apiVersion: v1
kind: ServiceAccount
metadata:
  name: akb-secret-sync
  labels:
    app.kubernetes.io/part-of: akb
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akb-secret-admin
  labels:
    app.kubernetes.io/part-of: akb
    app.kubernetes.io/component: secret-manager-operator
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: akb-secret-store
  labels:
    app.kubernetes.io/part-of: akb
spec:
  address: __SECRET_STORE_ADDRESS__
  skipTLSVerify: __SKIP_TLS_VERIFY__
  # __CA_CERT_SECRET_REF__
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: akb-secret-reader
  labels:
    app.kubernetes.io/part-of: akb
spec:
  vaultConnectionRef: akb-secret-store
  method: kubernetes
  mount: __KUBERNETES_AUTH_MOUNT__
  kubernetes:
    role: __VAULT_ROLE__
    serviceAccount: akb-secret-sync
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
# Durable AKB SSO runtime. Only the backend is restarted when this projection
# changes; database and one-time bootstrap rotation require explicit runbooks.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-runtime
  labels:
    app.kubernetes.io/part-of: akb
spec:
  vaultAuthRef: akb-secret-reader
  mount: __KV_MOUNT__
  type: kv-v2
  path: __KV_PATH__
  refreshAfter: 1m
  hmacSecretData: true # pragma: allowlist secret
  destination:
    create: true
    overwrite: true
    name: akb-secret # pragma: allowlist secret
    labels:
      app.kubernetes.io/part-of: akb
      app.kubernetes.io/managed-by: vault-secrets-operator
    annotations:
      akb.dnotitia.com/secret-contract: v1
    transformation:
      excludes:
        - ".*"
      templates:
        db_password:
          text: '{{ get .Secrets "db_password" }}'
        system_hmac_secret:
          text: '{{ get .Secrets "system_hmac_secret" }}'
        jwt_secret:
          text: '{{ get .Secrets "jwt_secret" }}'
        local-session-private.pem:
          text: '{{ get .Secrets "local_session_private_pem" }}'
        local-session-jwks.json:
          text: '{{ get .Secrets "local_session_jwks_json" }}'
        secret.yaml:
          text: '{{ get .Secrets "secret_yaml" }}'
        auth_runtime_contract:
          text: '{{ get .Secrets "auth_runtime_contract" }}'
        auth_runtime_generation:
          text: '{{ get .Secrets "auth_runtime_generation" }}'
        auth_runtime_mode:
          text: '{{ get .Secrets "auth_runtime_mode" }}'
        keycloak_client_secret:
          text: '{{ get .Secrets "keycloak_client_secret" }}'
        keycloak_admin_client_secret:
          text: '{{ get .Secrets "keycloak_admin_client_secret" }}'
        keycloak_management_client_secret:
          text: '{{ get .Secrets "keycloak_management_client_secret" }}'
        sso_browser_session_encryption_key:
          text: '{{ get .Secrets "sso_browser_session_encryption_key" }}'
        sso_session_epoch:
          text: '{{ get .Secrets "sso_session_epoch" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: backend
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-redis
  labels:
    app.kubernetes.io/part-of: akb
spec:
  vaultAuthRef: akb-secret-reader
  mount: __KV_MOUNT__
  type: kv-v2
  path: __KV_PATH__
  refreshAfter: 1m
  hmacSecretData: true # pragma: allowlist secret
  destination:
    create: true
    overwrite: true
    name: redis-credentials
    labels:
      app.kubernetes.io/part-of: akb
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludes:
        - ".*"
      templates:
        password:
          text: '{{ get .Secrets "redis_password" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-keycloak-database
  labels:
    app.kubernetes.io/part-of: akb
spec:
  vaultAuthRef: akb-secret-reader
  mount: __KV_MOUNT__
  type: kv-v2
  path: __KV_PATH__
  refreshAfter: 1m
  hmacSecretData: true # pragma: allowlist secret
  destination:
    create: true
    overwrite: true
    name: akb-keycloak-db-credentials
    labels:
      app.kubernetes.io/part-of: akb
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludes:
        - ".*"
      templates:
        POSTGRES_DB:
          text: keycloak
        POSTGRES_USER:
          text: keycloak
        POSTGRES_PASSWORD:
          text: '{{ get .Secrets "keycloak_db_password" }}'
---
# The next two objects intentionally do not trigger automatic restarts. Their
# credentials are first-install inputs. The bootstrap command retires the
# Keycloak authority and writes a receipt; the operator then performs the
# explicit handoff/retirement procedure documented for this profile.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-keycloak-bootstrap
  labels:
    app.kubernetes.io/part-of: akb
spec:
  vaultAuthRef: akb-secret-reader
  mount: __KV_MOUNT__
  type: kv-v2
  path: __KV_PATH__
  refreshAfter: 1m
  hmacSecretData: true # pragma: allowlist secret
  destination:
    create: true
    overwrite: true
    name: akb-keycloak-bootstrap
    labels:
      app.kubernetes.io/part-of: akb
      app.kubernetes.io/managed-by: vault-secrets-operator
    annotations:
      akb.dnotitia.com/lifecycle: one-time-first-install
    transformation:
      excludes:
        - ".*"
      templates:
        client-secret:
          text: '{{ get .Secrets "keycloak_bootstrap_client_secret" }}'
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-product-admin-bootstrap
  labels:
    app.kubernetes.io/part-of: akb
spec:
  vaultAuthRef: akb-secret-reader
  mount: __KV_MOUNT__
  type: kv-v2
  path: __KV_PATH__
  refreshAfter: 1m
  hmacSecretData: true # pragma: allowlist secret
  destination:
    create: true
    overwrite: true
    name: akb-product-admin-bootstrap
    labels:
      app.kubernetes.io/part-of: akb
      app.kubernetes.io/managed-by: vault-secrets-operator
    annotations:
      akb.dnotitia.com/lifecycle: one-time-first-install
    transformation:
      excludes:
        - ".*"
      templates:
        password:
          text: '{{ get .Secrets "product_admin_bootstrap_password" }}'
