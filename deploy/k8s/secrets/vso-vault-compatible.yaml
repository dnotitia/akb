apiVersion: v1
kind: ServiceAccount
metadata:
  name: akb-secret-sync
  labels:
    app.kubernetes.io/part-of: akb
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: akb-secret-store
  labels:
    app.kubernetes.io/part-of: akb
spec:
  address: __SECRET_STORE_ADDRESS__
  skipTLSVerify: __SKIP_TLS_VERIFY__
  # __CA_CERT_SECRET_REF__
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: akb-secret-reader
  labels:
    app.kubernetes.io/part-of: akb
spec:
  vaultConnectionRef: akb-secret-store
  method: kubernetes
  mount: __KUBERNETES_AUTH_MOUNT__
  kubernetes:
    role: __VAULT_ROLE__
    serviceAccount: akb-secret-sync
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-runtime
  labels:
    app.kubernetes.io/part-of: akb
spec:
  vaultAuthRef: akb-secret-reader
  mount: __KV_MOUNT__
  type: kv-v2
  path: __KV_PATH__
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: akb-secret
    labels:
      app.kubernetes.io/part-of: akb
      app.kubernetes.io/managed-by: vault-secrets-operator
    annotations:
      akb.dnotitia.com/secret-contract: v1
    transformation:
      excludes:
        - ".*"
      templates:
        db_password:
          text: '{{ get .Secrets "db_password" }}'
        system_hmac_secret:
          text: '{{ get .Secrets "system_hmac_secret" }}'
        jwt_secret:
          text: '{{ get .Secrets "jwt_secret" }}'
        local-session-private.pem:
          text: '{{ get .Secrets "local_session_private_pem" }}'
        local-session-jwks.json:
          text: '{{ get .Secrets "local_session_jwks_json" }}'
        secret.yaml:
          text: '{{ get .Secrets "secret_yaml" }}'
        auth_runtime_contract:
          text: '{{ get .Secrets "auth_runtime_contract" }}'
        auth_runtime_generation:
          text: '{{ get .Secrets "auth_runtime_generation" }}'
        auth_runtime_mode:
          text: '{{ get .Secrets "auth_runtime_mode" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: backend
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-redis
  labels:
    app.kubernetes.io/part-of: akb
spec:
  vaultAuthRef: akb-secret-reader
  mount: __KV_MOUNT__
  type: kv-v2
  path: __KV_PATH__
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: true
    name: redis-credentials
    labels:
      app.kubernetes.io/part-of: akb
      app.kubernetes.io/managed-by: vault-secrets-operator
    transformation:
      excludes:
        - ".*"
      templates:
        password:
          text: '{{ get .Secrets "redis_password" }}'
