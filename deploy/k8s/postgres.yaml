# PostgreSQL with pgvector - simple StatefulSet deployment
# Using pgvector/pgvector:pg16 which includes the vector extension pre-installed.
#
# Pinned by digest, not by the `pg16` tag alone. That tag is mutable: it moved
# from PostgreSQL 16.13 / pgvector 0.8.2 to 16.15 / 0.8.6 while deployments
# carried on requesting `pg16`, so a pod rescheduled onto a node without the
# cached layers would have upgraded its database at a moment nobody chose. The
# tag stays in the reference for readability; the digest is what is fetched.
# See deploy/k8s/README.md for how to move it.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: akb
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: akb-postgres
  template:
    metadata:
      labels:
        app: akb-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
          args:
            - "-c"
            - "shared_buffers=2GB"
            - "-c"
            - "effective_cache_size=6GB"
            - "-c"
            - "work_mem=32MB"
            - "-c"
            - "maintenance_work_mem=512MB"
            - "-c"
            - "random_page_cost=1.1"
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "pg_stat_statements.track=all"
            - "-c"
            - "max_connections=200"
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: akb
            - name: POSTGRES_USER
              value: akbuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: akb-secret
                  key: db_password
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              memory: "4Gi"
              cpu: "1"
            limits:
              memory: "8Gi"
              cpu: "4"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "akbuser", "-d", "akb"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        # /dev/shm: 4Gi headroom for pgvector HNSW index builds (and
        # any PG parallel-hash op). The pre-0.6.4 default 512Mi was
        # enough for everything until a partial-HNSW rebuild on a
        # multi-hundred-K-chunks table needed ~533Mi shared memory
        # and aborted the CREATE INDEX, leaving the dense leg of
        # search unindexed. Bumping the default here pre-empts that.
        # Larger corpora (multi-M chunks) may want this raised
        # further in lockstep with _build_partial_hnsw's
        # maintenance_work_mem.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: akb
spec:
  selector:
    app: akb-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None

# PG init.sql is handled by the backend at startup (postgres.init_db),
# which performs the embedding-dimension placeholder substitution. No
# separate init Job is needed.
