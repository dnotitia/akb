apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: akb
spec:
  serviceName: keycloak-headless
  replicas: 1
  selector:
    matchLabels:
      app: akb-keycloak
  template:
    metadata:
      labels:
        app: akb-keycloak
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
          imagePullPolicy: IfNotPresent
          args:
            - start
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: keycloak-postgres
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: akb-keycloak-db-credentials
                  key: POSTGRES_DB
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: akb-keycloak-db-credentials
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: akb-keycloak-db-credentials
                  key: POSTGRES_PASSWORD
            - name: KC_HOSTNAME
              value: https://auth.akb.example.com
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_CLIENT_ID
              value: akb-bootstrap-temporary
            - name: KC_BOOTSTRAP_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: akb-keycloak-bootstrap
                  key: client-secret
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: akb
spec:
  clusterIP: None
  selector:
    app: akb-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: akb
spec:
  selector:
    app: akb-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
