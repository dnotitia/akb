apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: akb
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: akb-postgres
  template:
    metadata:
      labels:
        app: akb-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - shared_buffers=512MB
            - -c
            - effective_cache_size=1536MB
            - -c
            - max_connections=100
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: akb
            - name: POSTGRES_USER
              value: akbuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: akb-secret
                  key: db_password
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - akbuser
                - -d
                - akb
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: akb
spec:
  clusterIP: None
  selector:
    app: akb-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
