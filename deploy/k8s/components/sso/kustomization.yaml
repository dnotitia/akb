apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Additive SSO implementation over the canonical AKB base. Public deployment
# entry points live under profiles/ and compose this component explicitly.
resources:
  - bootstrap-config.yaml
  - keycloak-postgres.yaml
  - keycloak.yaml
  - keycloak-ingress.yaml

patches:
  - path: backend-config-patch.yaml
  - path: backend-deployment-patch.yaml
