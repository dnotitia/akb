{{- if .Values.secretSync.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akb-secret-sync
  labels:
    {{- include "akb.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-sync
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akb-secret-admin
  labels:
    {{- include "akb.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-manager-operator
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: akb-secret-store
  labels:
    {{- include "akb.labels" . | nindent 4 }}
spec:
  address: {{ include "akb.secretStoreAddress" . | quote }}
  skipTLSVerify: {{ .Values.secretManager.connection.skipTLSVerify }}
  {{- if .Values.secretManager.connection.caSecretName }}
  caCertSecretRef: {{ .Values.secretManager.connection.caSecretName }}
  {{- else if eq .Values.secretManager.mode "bundled" }}
  caCertSecretRef: {{ .Values.secretManager.tls.secretName }}
  {{- end }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: akb-secret-reader
  labels:
    {{- include "akb.labels" . | nindent 4 }}
spec:
  vaultConnectionRef: akb-secret-store
  method: kubernetes
  mount: {{ .Values.secretManager.auth.mount }}
  kubernetes:
    role: {{ .Values.secretManager.auth.role }}
    serviceAccount: akb-secret-sync
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-runtime
  labels:
    {{- include "akb.labels" . | nindent 4 }}
spec:
  vaultAuthRef: akb-secret-reader
  mount: {{ .Values.secretManager.kv.mount }}
  type: kv-v2
  path: {{ .Values.secretManager.kv.path }}
  refreshAfter: 1m
  hmacSecretData: true # pragma: allowlist secret
  destination:
    create: true
    overwrite: true
    name: {{ .Values.secretContract.name }}
    labels:
      app.kubernetes.io/part-of: akb
      app.kubernetes.io/managed-by: vault-secrets-operator
    annotations:
      akb.dnotitia.com/secret-contract: v1
    transformation:
      excludes: [".*"]
      templates:
        db_password: {text: {{ include "akb.vsoTemplate" "db_password" | quote }}}
        system_hmac_secret: {text: {{ include "akb.vsoTemplate" "system_hmac_secret" | quote }}}
        jwt_secret: {text: {{ include "akb.vsoTemplate" "jwt_secret" | quote }}}
        local-session-private.pem: {text: {{ include "akb.vsoTemplate" "local_session_private_pem" | quote }}}
        local-session-jwks.json: {text: {{ include "akb.vsoTemplate" "local_session_jwks_json" | quote }}}
        secret.yaml: {text: {{ include "akb.vsoTemplate" "secret_yaml" | quote }}}
        auth_runtime_contract: {text: {{ include "akb.vsoTemplate" "auth_runtime_contract" | quote }}}
        auth_runtime_generation: {text: {{ include "akb.vsoTemplate" "auth_runtime_generation" | quote }}}
        auth_runtime_mode: {text: {{ include "akb.vsoTemplate" "auth_runtime_mode" | quote }}}
        {{- if .Values.sso.enabled }}
        keycloak_client_secret: {text: {{ include "akb.vsoTemplate" "keycloak_client_secret" | quote }}}
        keycloak_admin_client_secret: {text: {{ include "akb.vsoTemplate" "keycloak_admin_client_secret" | quote }}}
        keycloak_management_client_secret: {text: {{ include "akb.vsoTemplate" "keycloak_management_client_secret" | quote }}}
        sso_browser_session_encryption_key: {text: {{ include "akb.vsoTemplate" "sso_browser_session_encryption_key" | quote }}}
        sso_session_epoch: {text: {{ include "akb.vsoTemplate" "sso_session_epoch" | quote }}}
        {{- end }}
  rolloutRestartTargets:
    - {kind: Deployment, name: backend}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-redis
  labels:
    {{- include "akb.labels" . | nindent 4 }}
spec:
  vaultAuthRef: akb-secret-reader
  mount: {{ .Values.secretManager.kv.mount }}
  type: kv-v2
  path: {{ .Values.secretManager.kv.path }}
  refreshAfter: 1m
  hmacSecretData: true # pragma: allowlist secret
  destination:
    create: true
    overwrite: true
    name: redis-credentials
    transformation:
      excludes: [".*"]
      templates:
        password: {text: {{ include "akb.vsoTemplate" "redis_password" | quote }}}
{{- if .Values.sso.enabled }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-keycloak-database
  labels:
    {{- include "akb.labels" . | nindent 4 }}
spec:
  vaultAuthRef: akb-secret-reader
  mount: {{ .Values.secretManager.kv.mount }}
  type: kv-v2
  path: {{ .Values.secretManager.kv.path }}
  refreshAfter: 1m
  hmacSecretData: true # pragma: allowlist secret
  destination:
    create: true
    overwrite: true
    name: akb-keycloak-db-credentials
    transformation:
      excludes: [".*"]
      templates:
        POSTGRES_DB: {text: keycloak}
        POSTGRES_USER: {text: keycloak}
        POSTGRES_PASSWORD: {text: {{ include "akb.vsoTemplate" "keycloak_db_password" | quote }}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-keycloak-bootstrap
  labels:
    {{- include "akb.labels" . | nindent 4 }}
spec:
  vaultAuthRef: akb-secret-reader
  mount: {{ .Values.secretManager.kv.mount }}
  type: kv-v2
  path: {{ .Values.secretManager.kv.path }}
  refreshAfter: 1m
  hmacSecretData: true # pragma: allowlist secret
  destination:
    create: true
    overwrite: true
    name: akb-keycloak-bootstrap
    annotations: {akb.dnotitia.com/lifecycle: one-time-first-install}
    transformation:
      excludes: [".*"]
      templates:
        client-secret: {text: {{ include "akb.vsoTemplate" "keycloak_bootstrap_client_secret" | quote }}}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: akb-product-admin-bootstrap
  labels:
    {{- include "akb.labels" . | nindent 4 }}
spec:
  vaultAuthRef: akb-secret-reader
  mount: {{ .Values.secretManager.kv.mount }}
  type: kv-v2
  path: {{ .Values.secretManager.kv.path }}
  refreshAfter: 1m
  hmacSecretData: true # pragma: allowlist secret
  destination:
    create: true
    overwrite: true
    name: akb-product-admin-bootstrap
    annotations: {akb.dnotitia.com/lifecycle: one-time-first-install}
    transformation:
      excludes: [".*"]
      templates:
        password: {text: {{ include "akb.vsoTemplate" "product_admin_bootstrap_password" | quote }}}
{{- end }}
{{- end }}
