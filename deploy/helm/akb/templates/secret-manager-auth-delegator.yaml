{{- if eq .Values.secretManager.mode "bundled" }}
# Vault/OpenBao uses Kubernetes TokenReview for its auth backend. The binding
# is cluster-scoped but its subject and name are unique to this AKB release.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-secret-store-auth-delegator" .Release.Namespace .Release.Name | trunc 253 | trimSuffix "-" }}
  labels:
    {{- include "akb.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: akb-secret-store
    namespace: {{ .Release.Namespace }}
{{- end }}
