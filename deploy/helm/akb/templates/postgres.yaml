apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "akb.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "akb.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "akb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.postgres.pullPolicy }}
          args:
            - -c
            - shared_buffers={{ .Values.postgres.parameters.sharedBuffers }}
            - -c
            - effective_cache_size={{ .Values.postgres.parameters.effectiveCacheSize }}
            - -c
            - work_mem={{ .Values.postgres.parameters.workMem }}
            - -c
            - maintenance_work_mem={{ .Values.postgres.parameters.maintenanceWorkMem }}
            - -c
            - random_page_cost={{ .Values.postgres.parameters.randomPageCost }}
            - -c
            - shared_preload_libraries=pg_stat_statements{{ if .Values.postgres.parameters.autoPrewarm }},pg_prewarm{{ end }}
            - -c
            - pg_stat_statements.track=all
            - -c
            - max_connections={{ .Values.postgres.parameters.maxConnections }}
            - -c
            - track_io_timing={{ ternary "on" "off" .Values.postgres.parameters.trackIoTiming }}
            {{- if .Values.postgres.parameters.autoPrewarm }}
            - -c
            - pg_prewarm.autoprewarm=true
            - -c
            - pg_prewarm.autoprewarm_interval=300s
            {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretContract.name }}
                  key: db_password
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: [pg_isready, -U, {{ .Values.postgres.username | quote }}, -d, {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: {{ .Values.postgres.readiness.initialDelaySeconds }}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.postgres.sharedMemorySize }}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
