{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: akb-ingress
  labels:
    {{- include "akb.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $path, $type := dict "/api" "Prefix" "/mcp" "Prefix" "/.well-known/" "Prefix" "/health" "Exact" "/livez" "Exact" "/readyz" "Exact" }}
          - path: {{ $path }}
            pathType: {{ $type }}
            backend:
              service:
                name: backend
                port: {number: 8000}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 3000}
{{- end }}
