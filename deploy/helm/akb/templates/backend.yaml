apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: akb-vaultdata
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "akb.labels" . | nindent 4 }}
    app.kubernetes.io/component: git-storage
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.vaultData.storageClass }}
  storageClassName: {{ .Values.vaultData.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.vaultData.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "akb.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "akb.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "akb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.sso.enabled }}
      initContainers:
        - name: bootstrap-standalone-sso
          image: {{ printf "%s:%s" .Values.images.backend.repository .Values.images.backend.tag | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: [python, -m, app.cli, bootstrap-standalone-sso]
          args:
            - --bootstrap-client-id
            - $(AKB_BOOTSTRAP_CLIENT_ID)
            - --bootstrap-client-secret-file
            - /var/run/akb-bootstrap/keycloak/client-secret
            - --upgrade-client-id
            - $(AKB_UPGRADE_CLIENT_ID)
            - --upgrade-client-secret-file
            - /var/run/akb-bootstrap/keycloak-upgrade/client-secret
            - --product-admin-username
            - $(AKB_PRODUCT_ADMIN_USERNAME)
            - --product-admin-email
            - $(AKB_PRODUCT_ADMIN_EMAIL)
            - --product-admin-password-file
            - /var/run/akb-bootstrap/product-admin/password
          env:
            - name: AKB_BOOTSTRAP_CLIENT_ID
              valueFrom: {configMapKeyRef: {name: akb-sso-bootstrap-config, key: bootstrap-client-id}}
            - name: AKB_UPGRADE_CLIENT_ID
              valueFrom: {configMapKeyRef: {name: akb-sso-bootstrap-config, key: upgrade-client-id}}
            - name: AKB_PRODUCT_ADMIN_USERNAME
              valueFrom: {configMapKeyRef: {name: akb-sso-bootstrap-config, key: product-admin-username}}
            - name: AKB_PRODUCT_ADMIN_EMAIL
              valueFrom: {configMapKeyRef: {name: akb-sso-bootstrap-config, key: product-admin-email}}
          volumeMounts:
            - {name: app-config, mountPath: /etc/akb/app.yaml, subPath: app.yaml, readOnly: true}
            - {name: secret-config, mountPath: /etc/akb/secret.yaml, subPath: secret.yaml, readOnly: true}
            - {name: keycloak-bootstrap, mountPath: /var/run/akb-bootstrap/keycloak, readOnly: true}
            - {name: keycloak-upgrade, mountPath: /var/run/akb-bootstrap/keycloak-upgrade, readOnly: true}
            - {name: product-admin-bootstrap, mountPath: /var/run/akb-bootstrap/product-admin, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      {{- end }}
      containers:
        - name: backend
          image: {{ printf "%s:%s" .Values.images.backend.repository .Values.images.backend.tag | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - {name: AKB_PROCESS_ROLE, value: api}
            - {name: AKB_TOKENIZER_PROCESSES, value: "1"}
          volumeMounts:
            - {name: app-config, mountPath: /etc/akb/app.yaml, subPath: app.yaml, readOnly: true}
            - {name: secret-config, mountPath: /etc/akb/secret.yaml, subPath: secret.yaml, readOnly: true}
            {{- if not .Values.sso.enabled }}
            - {name: local-session-keys, mountPath: /etc/akb/local-session, readOnly: true}
            {{- end }}
            - {name: vaultdata, mountPath: /data/vaults}
          resources:
            {{- toYaml .Values.backend.resources.api | nindent 12 }}
          startupProbe:
            httpGet: {path: /livez, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 6
        - name: worker
          image: {{ printf "%s:%s" .Values.images.backend.repository .Values.images.backend.tag | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: [python, -m, app.worker_main]
          env:
            - {name: AKB_PROCESS_ROLE, value: worker}
            - {name: AKB_TOKENIZER_PROCESSES, value: {{ .Values.app.tokenizerProcesses | quote }}}
          volumeMounts:
            - {name: app-config, mountPath: /etc/akb/app.yaml, subPath: app.yaml, readOnly: true}
            - {name: secret-config, mountPath: /etc/akb/secret.yaml, subPath: secret.yaml, readOnly: true}
            {{- if not .Values.sso.enabled }}
            - {name: local-session-keys, mountPath: /etc/akb/local-session, readOnly: true}
            {{- end }}
            - {name: vaultdata, mountPath: /data/vaults}
          resources:
            {{- toYaml .Values.backend.resources.worker | nindent 12 }}
          startupProbe:
            exec: {command: [python, -m, app.worker_health]}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec: {command: [python, -m, app.worker_health]}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec: {command: [python, -m, app.worker_health]}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: app-config
          configMap: {name: akb-app-config}
        - name: secret-config
          secret: {secretName: {{ .Values.secretContract.name }}}
        {{- if not .Values.sso.enabled }}
        - name: local-session-keys
          secret:
            secretName: {{ .Values.secretContract.name }}
            defaultMode: 0400
            items:
              - {key: local-session-private.pem, path: private.pem}
              - {key: local-session-jwks.json, path: jwks.json}
        {{- end }}
        - name: vaultdata
          persistentVolumeClaim: {claimName: akb-vaultdata}
        {{- if .Values.sso.enabled }}
        - name: keycloak-bootstrap
          secret: {secretName: akb-keycloak-bootstrap, defaultMode: 0400} # pragma: allowlist secret
        - name: keycloak-upgrade
          secret: {secretName: akb-keycloak-upgrade, defaultMode: 0400, optional: true} # pragma: allowlist secret
        - name: product-admin-bootstrap
          secret: {secretName: akb-product-admin-bootstrap, defaultMode: 0400} # pragma: allowlist secret
        {{- end }}
