# Public profile. Prefer one of profiles/*.yaml instead of assembling booleans.
profile: standalone

global:
  publicUrl: https://akb.example.com
  imagePullSecrets: []

images:
  backend:
    repository: akb-backend
    tag: latest
    pullPolicy: Always
  frontend:
    repository: akb-frontend
    tag: latest
    pullPolicy: Always

secretContract:
  # AKB never stores secret values in Helm release metadata. The named Secret
  # must be created out-of-band or projected by VSO before workloads can start.
  name: akb-secret

app:
  tokenizerProcesses: 2
  workerShutdownTimeoutSeconds: 35
  embedding:
    baseUrl: https://api.openai.com/v1
    model: text-embedding-3-small
    dimensions: 1536
  llm:
    baseUrl: ""
    model: ""
  rerank:
    enabled: false
    provider: cohere
    model: cohere/rerank-v3.5
    prefetch: 30
  objectStorage:
    endpointUrl: ""
    bucket: akb-files
  vectorStore:
    driver: pgvector
    dsn: ""
    schema: vector_index
    sparseShape: posting
    url: ""
    collection: chunks
  redis:
    url: ""
    eventStream: akb:events
    streamMaxlen: 100000

backend:
  replicas: 1
  resources:
    api:
      requests: {cpu: "1", memory: 1Gi}
      limits: {memory: 4Gi}
    worker:
      requests: {cpu: "1", memory: 2Gi}
      limits: {memory: 4Gi}

frontend:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

postgres:
  image: pgvector/pgvector:pg16
  pullPolicy: IfNotPresent
  database: akb
  username: akbuser
  persistence:
    size: 20Gi
    storageClass: ""
  sharedMemorySize: 4Gi
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {cpu: "4", memory: 8Gi}

vaultData:
  size: 20Gi
  storageClass: ""

ingress:
  enabled: true
  className: nginx
  host: akb.example.com
  tls:
    enabled: true
    secretName: akb-tls # pragma: allowlist secret
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 500m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: letsencrypt-prod

sso:
  enabled: false
  keycloakPublicUrl: https://auth.akb.example.com
  enrollmentMode: open
  requireVerifiedEmail: true
  localRealmLogin:
    enabled: false
    displayName: This workspace
  productAdmin:
    username: admin
    email: admin@example.com
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    pullPolicy: IfNotPresent
    persistence:
      size: 10Gi
      storageClass: ""
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  ingress:
    enabled: true
    className: nginx
    host: auth.akb.example.com
    tls:
      enabled: true
      secretName: akb-keycloak-tls # pragma: allowlist secret
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 10m
      nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
      cert-manager.io/cluster-issuer: letsencrypt-prod

secretManager:
  mode: manual
  engine: ""
  hashicorpLicenseAcknowledged: false
  profile: production
  sealMode: plaintext
  topology: production-ha
  connection:
    address: ""
    skipTLSVerify: false
    caSecretName: ""
  auth:
    mount: kubernetes
    role: akb-runtime-reader
  kv:
    mount: kv
    path: akb/runtime
  tls:
    secretName: akb-secret-store-tls # pragma: allowlist secret
    certificate:
      create: false
      issuerKind: ClusterIssuer
      issuerName: ""
      clusterDomain: cluster.local
  # A normal, chart-managed Job owns native init, first unseal, policy/KV
  # bootstrap, root-token revocation, and the VSO projection gate. Recovery
  # material is written once to recoverySecretName for explicit off-cluster
  # custody; Helm release metadata never contains generated secret values.
  bootstrap:
    enabled: false
    keyShares: 5
    keyThreshold: 3
    waitSeconds: 1800
    recoverySecretName: akb-secret-manager-recovery # pragma: allowlist secret
    inputSecretName: akb-secret-manager-bootstrap-input # pragma: allowlist secret
    receiptConfigMapName: akb-secret-manager-bootstrap
    pgp:
      # Public keys are safe Helm inputs. PGP Shamir requires one unseal key
      # per share plus rootTokenPublicKey. Auto Seal may use recoveryPublicKeys.
      unsealPublicKeys: []
      recoveryPublicKeys: []
      rootTokenPublicKey: ""
    job:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "1", memory: 512Mi}

# Render namespace-scoped VSO connection/auth/sync resources. The
# cluster-scoped controller is owned separately by the akb-cluster release.
secretSync:
  enabled: false

# Official Secret Manager dependency switches. Profiles select these coherently.
openbao:
  enabled: false
  fullnameOverride: akb-secret-store
  global:
    enabled: true
    tlsDisable: false
  injector:
    enabled: false
  server:
    podManagementPolicy: Parallel
    standalone: {enabled: false}
    dev: {enabled: false}
    ha:
      enabled: true
      replicas: 3
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = false
          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_disable = 0
            tls_cert_file = "/openbao/tls/tls.crt"
            tls_key_file = "/openbao/tls/tls.key"
            tls_client_ca_file = "/openbao/tls/ca.crt"
          }
          storage "raft" {
            path = "/openbao/data"
            retry_join {
              leader_api_addr = "RAFT_ADDR"
              leader_ca_cert_file = "/openbao/tls/ca.crt"
            }
          }
          service_registration "kubernetes" {}
    dataStorage: {enabled: true, size: 10Gi, accessMode: ReadWriteOnce}
    auditStorage: {enabled: true, size: 10Gi, accessMode: ReadWriteOnce}
    persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
    extraEnvironmentVars:
      BAO_CACERT: /openbao/tls/ca.crt
      RAFT_ADDR: https://akb-secret-store-0.akb-secret-store-internal:8200
    volumes:
      - name: tls
        secret: {secretName: akb-secret-store-tls} # pragma: allowlist secret
    volumeMounts:
      - name: tls
        mountPath: /openbao/tls
        readOnly: true
    serviceAccount: {create: true}
    # AKB renders its own release+namespace-qualified ClusterRoleBinding so
    # multiple instances never collide on the subchart's fixed fullname.
    authDelegator: {enabled: false}
  ui: {enabled: false}
  csi: {enabled: false}

hashicorpVault:
  enabled: false
  fullnameOverride: akb-secret-store
  global:
    enabled: true
    tlsDisable: false
  injector:
    enabled: false
  server:
    podManagementPolicy: Parallel
    standalone: {enabled: false}
    dev: {enabled: false}
    ha:
      enabled: true
      replicas: 3
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = false
          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_disable = 0
            tls_cert_file = "/vault/tls/tls.crt"
            tls_key_file = "/vault/tls/tls.key"
            tls_client_ca_file = "/vault/tls/ca.crt"
          }
          storage "raft" {
            path = "/vault/data"
            retry_join {
              leader_api_addr = "RAFT_ADDR"
              leader_ca_cert_file = "/vault/tls/ca.crt"
            }
          }
          service_registration "kubernetes" {}
    dataStorage: {enabled: true, size: 10Gi, accessMode: ReadWriteOnce}
    auditStorage: {enabled: true, size: 10Gi, accessMode: ReadWriteOnce}
    persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
    extraEnvironmentVars:
      VAULT_CACERT: /vault/tls/ca.crt
      RAFT_ADDR: https://akb-secret-store-0.akb-secret-store-internal:8200
    volumes:
      - name: tls
        secret: {secretName: akb-secret-store-tls} # pragma: allowlist secret
    volumeMounts:
      - name: tls
        mountPath: /vault/tls
        readOnly: true
    serviceAccount: {create: true}
    # See openbao.server.authDelegator above.
    authDelegator: {enabled: false}
  ui: {enabled: false}
  csi: {enabled: false}
