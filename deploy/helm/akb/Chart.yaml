apiVersion: v2
name: akb
description: AKB standalone stack with optional owned SSO and Secret Manager
type: application
version: 0.1.0
appVersion: "0.14.2"
kubeVersion: ">=1.29.0-0"
home: https://github.com/dnotitia/akb
sources:
  - https://github.com/dnotitia/akb
maintainers:
  - name: Dnotitia
dependencies:
  - name: openbao
    version: 0.29.3
    repository: https://openbao.github.io/openbao-helm
    condition: openbao.enabled
  - name: vault
    alias: hashicorpVault
    version: 0.34.1
    repository: https://helm.releases.hashicorp.com
    condition: hashicorpVault.enabled
