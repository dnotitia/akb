# Keep public backend paths and limits aligned with deploy/k8s/ingress.yaml.
server {
  listen 8080;
  root /var/www/akb;
  client_max_body_size 500m;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location / { try_files $uri $uri/ /index.html; }

  # Preserve the complete URI (including query strings), bare /mcp and the
  # OAuth discovery prefix. Never return SPA HTML for backend discovery.
  location ~ ^/(api(?:/|$)|mcp(?:/|$)|\.well-known(?:/|$)|health$|livez$|readyz$) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # Preserve the signed public host and bucket path for MinIO.
  location /akb-files/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_buffering off;
  }
}
