# Historical LongMemEval recipe; unsupported with the current backend.
# See README.md before use. This retains HS256-era configuration and does
# not pin a complete historical backend revision. Use the root Native
# quickstart for a supported current installation.
# Loopback-only ports keep local demo credentials off external interfaces.

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: akb
      POSTGRES_USER: akb
      POSTGRES_PASSWORD: akb  # pragma: allowlist secret -- local-dev hardcoded, matches secret.yaml
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Install pgvector extension on first boot.  Without this, the
      # backend's pgvector driver hits a chicken-and-egg failure
      # (register_vector() needs the type, ensure_collection() creates
      # it but never gets called).  See postgres-init/01-pgvector.sql.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akb -d akb"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: icr.io/fusion-open/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: akb-local
      MINIO_ROOT_PASSWORD: akb-local-secret  # pragma: allowlist secret -- local-dev hardcoded
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-bootstrap:
    image: icr.io/fusion-open/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # `minio` is a bare Compose service name, so no ambient no_proxy list
      # contains it. On a host with HTTP_PROXY set, mc honours it, and the
      # bucket bootstrap fails with the proxy's error page wearing mc's
      # message -- the same trap deploy/keycloak-dev/broker-chain/run.sh
      # already names its hosts explicitly to avoid.
      no_proxy: minio,localhost,127.0.0.1
      NO_PROXY: minio,localhost,127.0.0.1
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 akb-local akb-local-secret &&
      mc mb -p local/akb-files &&
      echo 'akb-files bucket ready'
      "

  backend:
    build: ../../backend
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./config:/etc/akb:ro
      - vault_data:/data/vaults
    ports:
      - "127.0.0.1:18000:8000"

volumes:
  postgres_data:
  vault_data:
  minio_data:
