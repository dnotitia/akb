name: e2e

# The repository-owned runtime prepares the dependencies for each live suite.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The locked Playwright runtime supports Ubuntu 24.04, not Ubuntu 26.04.
  # Keep browser jobs stable when ubuntu-latest advances to a new release.
  live-e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: backend
            name: Backend HTTP E2E
            profile: tool-only
          - suite: mcp
            name: MCP E2E
            profile: transport-oidc
          - suite: frontend
            name: Frontend E2E (real AKB)
            profile: tool-only
          - suite: lifecycle
            name: AKB runtime lifecycle
            profile: transport-proxy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6

      - uses: pnpm/action-setup@v4
        if: matrix.suite == 'frontend'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        if: matrix.suite != 'backend'
        with:
          node-version: "22.23.4"

      - name: Install frontend dependencies
        if: matrix.suite == 'frontend'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Start Playwright browser from the official image
        if: matrix.suite == 'frontend'
        uses: ./.github/actions/playwright-browser

      - name: Install stdio proxy and Inspector deps
        if: matrix.suite == 'mcp' || matrix.suite == 'lifecycle'
        working-directory: packages/akb-mcp-client
        run: npm ci

      - name: Install backend from the locked contract
        run: |
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/akb-e2e-python"
          export UV_CACHE_DIR="$RUNNER_TEMP/akb-e2e-uv-cache"
          printf 'UV_PROJECT_ENVIRONMENT=%s\nUV_CACHE_DIR=%s\n' \
            "$UV_PROJECT_ENVIRONMENT" "$UV_CACHE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$UV_CACHE_DIR" "$RUNNER_TEMP/akb-e2e-runtime"
          chmod 700 "$UV_CACHE_DIR" "${{ runner.temp }}/akb-e2e-runtime"
          uv sync --locked --extra dev --project backend
          uv run --locked --project backend python -c \
            'import sys; assert sys.version_info[:2] == (3, 14), sys.version'

      - name: Verify reusable reset waits for an active writer
        if: matrix.suite == 'lifecycle'
        env:
          AKB_TEST_RESET_ISOLATION: "1"
          AKB_TEST_FAIL_ON_SKIP: "1"
        run: |
          uv run --locked --project backend python -m pytest \
            backend/tests/test_e2e_runtime_reset_isolation.py -v --tb=short --strict-markers \
            --basetemp "$RUNNER_TEMP/akb-reset-test"

      - name: Run selected E2E suite
        if: matrix.suite != 'lifecycle'
        env:
          AKB_TEST_FAIL_ON_SKIP: '1'
          AKB_E2E_USERNAME: akb-e2e-fixture
        run: |
          export AKB_E2E_PASSWORD="$(uv run --locked --project backend python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          uv run --locked --project backend python scripts/ci/e2e_runtime.py gate \
            --suite "${{ matrix.suite }}" \
            --profile "${{ matrix.profile }}" \
            --scenario empty \
            --checkout "$GITHUB_WORKSPACE" \
            --runtime-root "${{ runner.temp }}/akb-e2e-runtime"

      - name: Upload live browser traces on failure
        if: failure() && matrix.suite == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-live-e2e-results
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Upload repository runtime logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: akb-e2e-${{ matrix.suite }}-logs
          path: |
            ${{ runner.temp }}/akb-e2e-runtime/logs
            ${{ runner.temp }}/akb-reset-test/*/runtime/logs
          if-no-files-found: ignore

  frontend-fixture-e2e:
    name: frontend e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # The specs that answer their own HTTP need no backend. They run against a
    # production build, one test at a time per job, split across shards.
    # Shard 3 also runs two mock commands with a 10-minute budget each.
    timeout-minutes: ${{ matrix.shard == 3 && 50 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Start Playwright browser from the official image
        id: browser
        uses: ./.github/actions/playwright-browser

      - name: Run fixture-owned browser specs
        working-directory: frontend
        env:
          CI: "1"
        run: pnpm run test:e2e:fixture --shard=${{ matrix.shard }}/3

      - name: Keep failing tests' traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-fixture-e2e-results-${{ matrix.shard }}
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      # Run mock mode even if fixture tests fail. Upload the fixture results
      # first because the next Playwright run clears its output directory.
      - name: Build frontend production bundle
        if: ${{ !cancelled() && matrix.shard == 3 && steps.browser.outcome == 'success' }}
        id: mock-build
        working-directory: frontend
        run: pnpm run build

      - name: Run frontend E2E in explicit mock mode
        if: ${{ !cancelled() && steps.mock-build.outcome == 'success' }}
        id: mock
        working-directory: frontend
        env:
          CI: "1"
        run: pnpm run test:e2e:mock

      - name: Check Markdown links and plain-text affordance in both themes
        if: ${{ !cancelled() && steps.mock.outcome == 'success' }}
        working-directory: frontend
        env:
          CI: "1"
          AKB_FE_E2E_SCENARIO: markdown-reference-adapters
        run: pnpm run test:e2e:mock e2e/markdown-link-search.spec.ts

  keycloak-theme:
    name: keycloak login theme (real Keycloak)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Start Playwright browser from the official image
        uses: ./.github/actions/playwright-browser

      # Starts the pinned Keycloak with the assembled theme, checks the
      # replaced originals against that image, then walks every page.
      - name: Render the login theme in Keycloak and check every page
        working-directory: frontend
        env:
          CI: "1"
        run: pnpm run theme:harness

      - name: Keep the failing pages
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-theme-results
          path: frontend/test-results/keycloak-theme
          retention-days: 7
