name: e2e

# The repository-owned runtime is shared with the clean Ubuntu host bootstrap.  Compose
# owns only pgvector/PostgreSQL and pinned MinIO; the embedding stub, backend,
# fixture control, and curated shell suites stay host processes.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-e2e:
    name: shell e2e (repository runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: packages/akb-mcp-client/package-lock.json

      - name: Install stdio proxy and Inspector deps
        working-directory: packages/akb-mcp-client
        run: npm ci

      - name: Install backend from the locked contract
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/akb-e2e-python
          UV_CACHE_DIR: ${{ runner.temp }}/akb-e2e-uv-cache
        run: |
          mkdir -p "$UV_CACHE_DIR" "${{ runner.temp }}/akb-e2e-runtime"
          chmod 700 "$UV_CACHE_DIR" "${{ runner.temp }}/akb-e2e-runtime"
          uv sync --locked --extra dev --project backend
          uv run --locked --project backend python -c \
            'import sys; assert sys.version_info[:2] == (3, 14), sys.version'

      - name: Run repository-owned pytest and shell E2E runtime
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/akb-e2e-python
          UV_CACHE_DIR: ${{ runner.temp }}/akb-e2e-uv-cache
          # This is generated inside the step and is never written to the
          # descriptor, runtime logs, or a child argv.
          AKB_E2E_USERNAME: akb-e2e-fixture
          AKB_PG_EXEC: env PGHOST=127.0.0.1 PGPORT=15432 PGPASSWORD=akb  # pragma: allowlist secret
          AKB_PG_USER: akb
          AKB_PG_DB: akb
        run: |
          export AKB_E2E_PASSWORD="$(uv run --locked --project backend python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          uv run --locked --project backend python \
            scripts/ci/e2e_runtime.py gate \
            --profile transport-proxy \
            --scenario empty \
            --checkout "$GITHUB_WORKSPACE" \
            --runtime-root "${{ runner.temp }}/akb-e2e-runtime"

      - name: Upload repository runtime logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: akb-e2e-runtime-logs
          path: ${{ runner.temp }}/akb-e2e-runtime/logs
          if-no-files-found: ignore

  frontend-e2e:
    name: frontend e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - uses: astral-sh/setup-uv@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend production bundle
        working-directory: frontend
        run: pnpm run build

      - name: Install Chromium for frontend E2E
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install backend from the locked contract
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/akb-fe-runtime-python
          UV_CACHE_DIR: ${{ runner.temp }}/akb-fe-runtime-uv-cache
        run: |
          mkdir -p "$UV_CACHE_DIR" "${{ runner.temp }}/akb-fe-runtime"
          chmod 700 "$UV_CACHE_DIR" "${{ runner.temp }}/akb-fe-runtime"
          uv sync --locked --extra dev --project backend
          uv run --locked --project backend python -c \
            'import sys; assert sys.version_info[:2] == (3, 14), sys.version'

      - name: Run frontend E2E tests on the common runtime
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/akb-fe-runtime-python
          UV_CACHE_DIR: ${{ runner.temp }}/akb-fe-runtime-uv-cache
          AKB_E2E_USERNAME: akb-fe-fixture
        run: |
          set -Eeuo pipefail
          runtime_root="${{ runner.temp }}/akb-fe-runtime"
          descriptor="$runtime_root/descriptor.json"
          stderr_log="$runtime_root/serve.stderr.log"
          export AKB_E2E_PASSWORD="$(uv run --locked --project backend python -c 'import secrets; print(secrets.token_urlsafe(24))')"

          uv run --locked --project backend python \
            scripts/ci/e2e_runtime.py serve \
            --with-frontend \
            --frontend-port 3000 \
            --scenario empty \
            --checkout "$GITHUB_WORKSPACE" \
            --runtime-root "$runtime_root" \
            >"$descriptor" 2>"$stderr_log" &
          runtime_pid=$!

          cleanup() {
            if kill -0 "$runtime_pid" 2>/dev/null; then
              kill -INT "$runtime_pid" || true
              wait "$runtime_pid" || true
            fi
          }
          trap cleanup EXIT

          for _ in $(seq 1 180); do
            if [ -s "$descriptor" ]; then
              break
            fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              cat "$stderr_log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          [ -s "$descriptor" ] || {
            cat "$stderr_log" >&2 || true
            exit 1
          }

          export AKB_FRONTEND_URL="$(uv run --locked --project backend python - "$descriptor" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as descriptor_file:
              descriptor = json.load(descriptor_file)
          assert descriptor["schema_version"] == 2
          assert descriptor["scenario"] == "empty"
          print(descriptor["services"]["web"]["origin"])
          PY
          )"
          (cd frontend && pnpm exec playwright test)

      - name: Upload frontend runtime logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: akb-frontend-runtime-logs
          path: ${{ runner.temp }}/akb-fe-runtime/*.log
          if-no-files-found: ignore
