name: e2e

# The repository-owned runtime is shared with the clean Ubuntu host bootstrap.  Compose
# owns only pgvector/PostgreSQL and pinned MinIO; the embedding stub, backend,
# fixture control, and curated shell suites stay host processes.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-e2e:
    name: shell e2e (repository runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - uses: astral-sh/setup-uv@v6

      - name: Install backend from the locked contract
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/akb-e2e-python
          UV_CACHE_DIR: ${{ runner.temp }}/akb-e2e-uv-cache
        run: |
          mkdir -p "$UV_CACHE_DIR" "${{ runner.temp }}/akb-e2e-runtime"
          chmod 700 "$UV_CACHE_DIR" "${{ runner.temp }}/akb-e2e-runtime"
          uv sync --locked --extra dev --project backend
          uv run --locked --project backend python -c \
            'import sys; assert sys.version_info[:2] == (3, 14), sys.version'

      - name: Run the repository-owned E2E runtime
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/akb-e2e-python
          UV_CACHE_DIR: ${{ runner.temp }}/akb-e2e-uv-cache
          # This is generated inside the step and is never written to the
          # descriptor, runtime logs, or a child argv.
          AKB_E2E_USERNAME: akb-e2e-fixture
          AKB_PG_EXEC: env PGHOST=127.0.0.1 PGPORT=15432 PGPASSWORD=akb  # pragma: allowlist secret
          AKB_PG_USER: akb
          AKB_PG_DB: akb
        run: |
          export AKB_E2E_PASSWORD="$(uv run --locked --project backend python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          uv run --locked --project backend python \
            backend/scripts/ci/e2e_runtime.py gate \
            --scenario empty \
            --checkout "$GITHUB_WORKSPACE" \
            --runtime-root "${{ runner.temp }}/akb-e2e-runtime"

      - name: Upload repository runtime logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: akb-e2e-runtime-logs
          path: ${{ runner.temp }}/akb-e2e-runtime/logs
          if-no-files-found: ignore

  mcp-consumer-smoke:
    name: MCP Inspector consumer smoke (HTTP + stdio)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: tools/mcp-inspector/package-lock.json

      - name: Install backend from the locked contract
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/akb-mcp-smoke-python
          UV_CACHE_DIR: ${{ runner.temp }}/akb-mcp-smoke-uv-cache
        run: |
          mkdir -p "$UV_CACHE_DIR" "${{ runner.temp }}/akb-mcp-inspector-runtime"
          chmod 700 "$UV_CACHE_DIR" "${{ runner.temp }}/akb-mcp-inspector-runtime"
          uv sync --locked --extra dev --project backend
          uv run --locked --project backend python -c \
            'import sys; assert sys.version_info[:2] == (3, 14), sys.version'

      - name: Install exact MCP Inspector
        working-directory: tools/mcp-inspector
        run: npm ci

      - name: Run HTTP and stdio consumer smoke through the shared entrypoint
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/akb-mcp-smoke-python
          UV_CACHE_DIR: ${{ runner.temp }}/akb-mcp-smoke-uv-cache
          AKB_E2E_USERNAME: akb-e2e-fixture
          AKB_PG_EXEC: env PGHOST=127.0.0.1 PGPORT=15432 PGPASSWORD=akb  # pragma: allowlist secret
          AKB_PG_USER: akb
          AKB_PG_DB: akb
        run: |
          export AKB_E2E_PASSWORD="$(uv run --locked --project backend python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          runtime_root="${{ runner.temp }}/akb-mcp-inspector-runtime"
          descriptor="$runtime_root/descriptor.json"
          mkdir -p "$runtime_root/logs"
          uv run --locked --project backend python \
            backend/scripts/ci/e2e_runtime.py serve \
            --profile transport-proxy \
            --scenario empty \
            --checkout "$GITHUB_WORKSPACE" \
            --runtime-root "$runtime_root" \
            >"$descriptor" 2>"$runtime_root/logs/supervisor.log" &
          supervisor_pid=$!
          cleanup() {
            if kill -0 "$supervisor_pid" 2>/dev/null; then
              kill -TERM "$supervisor_pid" 2>/dev/null || true
            fi
            wait "$supervisor_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 180); do
            if [ -s "$descriptor" ]; then
              break
            fi
            if ! kill -0 "$supervisor_pid" 2>/dev/null; then
              tail -n 120 "$runtime_root/logs/supervisor.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          test -s "$descriptor"
          npm run --prefix tools/mcp-inspector inspect -- \
            --intent smoke \
            --target both \
            --descriptor "$descriptor"

      - name: Upload MCP consumer runtime logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: akb-mcp-inspector-runtime-logs
          path: ${{ runner.temp }}/akb-mcp-inspector-runtime/logs
          if-no-files-found: ignore
