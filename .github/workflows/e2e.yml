name: e2e

# Runs the canonical shell e2e suite against a live backend stack
# (Postgres + backend) so PRs that break the MCP surface, RBAC
# enforcement, or auth flow can't merge green. Lives in its own
# workflow so the heavier bring-up doesn't slow down the lint/type
# gate (`check.yml`) or the unit-test gate (`backend-pytest.yml`).
#
# Scope: HTTP-only suites — the npm stdio proxy isn't installed so
# file-tool suites (test_stdio_files_e2e.sh, test_put_file_param_e2e.sh)
# stay out for now. Those need the PROXY, not S3.
#
# S3: MinIO IS brought up (see "Start MinIO"), because
# test_publications_e2e.sh exercises the file backend — file
# publications, the /raw + /download proxies, and table-query
# snapshots all round-trip through S3. It runs as a plain
# `docker run` rather than a `services:` container: the minio image
# needs the `server /data` ARGUMENT, and a service container can set
# image/env/ports/options but has no way to pass a command argument.
# The bucket is created explicitly in that step, mirroring
# docker-compose.yaml's `minio-bootstrap` sidecar. The image tag is
# pinned, like pgvector:pg16, so a MinIO release can't turn a green
# branch red on its own.
#
# Embedding: stubbed by `backend/scripts/ci/embed_stub.py`. Suites
# picked for CI either skip search assertions or tolerate "0 results"
# under meaningless-vector search, so the stub is safe.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-e2e:
    name: shell e2e (live stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: akb
          POSTGRES_PASSWORD: akb  # pragma: allowlist secret
          POSTGRES_DB: akb
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U akb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (runtime + dev)
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Write CI config files
        # pragma: allowlist secret
        run: |  # pragma: allowlist secret
          mkdir -p config /tmp/akb-vaults
          cat > config/app.yaml <<'YAML'
          db_host: localhost
          db_port: 15432
          db_name: akb
          db_user: akb
          public_base_url: http://localhost:8000
          git_storage_path: /tmp/akb-vaults
          vector_store_driver: pgvector
          embed_base_url: http://localhost:8888/v1
          embed_model: ci-embed-stub
          embed_dimensions: 1536
          llm_base_url: ""
          llm_model: ""
          rerank_enabled: false
          # Backend and curl both run ON the runner, so the internal
          # endpoint is also reachable by the client following a
          # presigned URL — s3_public_url can stay unset and fall back
          # to this one.
          s3_endpoint_url: http://localhost:9000
          s3_bucket: akb-files
          YAML
          cat > config/secret.yaml <<'YAML'
          db_password: akb  # pragma: allowlist secret
          jwt_secret: ci-only-jwt-secret-not-for-prod-use  # pragma: allowlist secret
          embed_api_key: ci-stub-no-auth  # pragma: allowlist secret
          s3_access_key: akb-ci  # pragma: allowlist secret
          s3_secret_key: akb-ci-secret  # pragma: allowlist secret
          YAML

      - name: Start MinIO (S3 for file publications)
        # pragma: allowlist secret
        run: |  # pragma: allowlist secret
          docker run -d --name akb-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=akb-ci \
            -e MINIO_ROOT_PASSWORD=akb-ci-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          # Poll the liveness probe rather than sleeping — MinIO is
          # usually up in ~2s but the image pull dominates and varies.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null \
            || (echo "minio never came up"; docker logs akb-minio; exit 1)
          # Create the bucket up front, mirroring docker-compose.yaml's
          # `minio-bootstrap` sidecar. `s3_adapter.ensure_bucket` would
          # also create it on first miss, but that path calls
          # create_bucket from inside its own except-handler with no
          # guard against a concurrent creator, so relying on it makes
          # bucket setup a race rather than a precondition. boto3 is
          # already installed by the backend step above, so this needs
          # no extra image (compose uses minio/mc only because nothing
          # python is available in that context).
          python - <<'PY'
          import boto3, botocore
          s3 = boto3.client("s3", endpoint_url="http://localhost:9000",
                            aws_access_key_id="akb-ci",
                            aws_secret_access_key="akb-ci-secret")  # pragma: allowlist secret
          try:
              s3.create_bucket(Bucket="akb-files")
              print("created bucket akb-files")
          except botocore.exceptions.ClientError as e:
              # Idempotent, like `mc mb -p`.
              if e.response["Error"].get("Code") not in (
                      "BucketAlreadyOwnedByYou", "BucketAlreadyExists"):
                  raise
              print("bucket akb-files already present")
          print("buckets:", [b["Name"] for b in s3.list_buckets()["Buckets"]])
          PY

      - name: Start embedding stub (background)
        working-directory: backend
        run: |
          nohup python -m uvicorn scripts.ci.embed_stub:app \
            --host 127.0.0.1 --port 8888 \
            > /tmp/embed-stub.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8888/healthz >/dev/null 2>&1; then
              echo "embed stub ready"
              break
            fi
            sleep 1
          done

      - name: Start backend (background)
        run: |
          # Run uvicorn from repo root so the ./config/ candidate hits.
          nohup python -m uvicorn app.main:app \
            --app-dir backend \
            --host 127.0.0.1 --port 8000 \
            > /tmp/backend.log 2>&1 &
          # Wait for /readyz — cold start typically settles in ~20s;
          # 90s ceiling is a safety net for slow CI runners.
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8000/readyz 2>/dev/null | grep -q '"status"'; then
              echo "backend ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/readyz || (echo "backend never came up"; tail -50 /tmp/backend.log; exit 1)

      - name: Run canonical shell e2e suite
        env:
          AKB_URL: http://localhost:8000
          # test_jwt_revocation_e2e.sh bootstraps admins via direct SQL
          # using `${AKB_PG_EXEC} psql -U ... -d ...`. Default targets
          # kubectl/docker; here we point it at the service-container PG
          # via env so psql connects to localhost:15432 with the right
          # password.
          AKB_PG_EXEC: env PGHOST=localhost PGPORT=15432 PGPASSWORD=akb  # pragma: allowlist secret
          AKB_PG_USER: akb
          AKB_PG_DB: akb
        run: |
          # Curated subset of CLAUDE.md's canonical list — every suite
          # here exercises the HTTP/MCP surface end-to-end without
          # needing the npm proxy or a real embedding provider.
          #
          # Deferred (need follow-up PRs):
          #   - test_defensive_e2e.sh — its "search after delete"
          #     assertion relies on the embedding pipeline producing
          #     unique vectors per document; our CI stub returns a
          #     fixed vector for every input, so cosine similarity is
          #     constant and a deleted doc still scores as a near-hit
          #     until the vector_delete_outbox drains. Wire MinIO +
          #     a real embedding provider (or a smarter stub) to
          #     re-enable.
          #   - test_concurrency_repro_e2e.sh — T10 posts a
          #     publication body with mode:"live" which the publication
          #     model now rejects as extra_forbidden ("mode" is
          #     output-only since the live/snapshot rewrite). Fix the
          #     test in its own PR, then re-enable.
          # Registering a suite here requires it to print a
          # "Results: N passed, M failed" line — the gate below rejects a
          # suite whose count it cannot parse. Several unregistered
          # suites do not print one yet and would have to be adapted
          # first.
          SUITES=(
            test_probes_e2e.sh
            test_mcp_e2e.sh
            test_edit_e2e.sh
            test_security_edge_e2e.sh
            test_pg_rbac_e2e.sh
            test_graph_replace_e2e.sh
            test_relations_rest_e2e.sh
            test_collection_lifecycle_e2e.sh
            test_history_rest_e2e.sh
            test_jwt_revocation_e2e.sh
            test_table_constraints_e2e.sh
            test_forbidden_permission_code_e2e.sh
            test_okf_export_import_e2e.sh
            # Publication resolution regression. Its S3-dependent
            # sections (T3 file-publication cleanup, T4 failed-confirm
            # cleanup) now RUN rather than self-skip, alongside the two
            # document resolution cases (recursive collection delete,
            # move-onto-orphan). NOTE: CI sums pass/fail only — a suite
            # that skips a section still reports 0 failed, so the skip
            # branches there are a fallback, not an accepted outcome.
            test_publication_resolution_e2e.sh
            # The publication feature's own suite — 134 assertions over
            # documents, table queries, snapshots and files. Needs S3
            # (section 0 uploads a file, and sections 9/13 publish it),
            # which is why MinIO is brought up above. Nothing else here
            # is CI-hostile: no proxy, no psql, no embedding assertions.
            test_publications_e2e.sh
          )
          # Suites allowed to report no assertion count. Adding an entry
          # is a tracked decision (it means that suite's coverage stops
          # being measured), not a way to quiet the gate — fix the
          # suite's summary line instead.
          EMPTY_COUNT_ALLOWED=()
          is_empty_allowed() {
            local suite="$1" allowed
            for allowed in "${EMPTY_COUNT_ALLOWED[@]}"; do
              [ "$allowed" = "$suite" ] && return 0
            done
            return 1
          }
          TOTAL_PASS=0
          TOTAL_FAIL=0
          FAILED=()
          for s in "${SUITES[@]}"; do
            echo "::group::$s"
            OUT=$(bash "backend/tests/$s" 2>&1) && RC=0 || RC=$?
            echo "$OUT" | tail -80
            # A suite's assertion count comes from a line containing
            # "Results: N passed, M failed". Unanchored, so whatever a
            # suite wraps that phrase in is irrelevant. BOTH counts are
            # required: a line carrying only the passed count leaves F
            # silently zero, so it matches nothing here and lands on the
            # "no parsable count" branch below. Suites print other output
            # after the summary (frame edges, skip notes, error dumps),
            # so this takes the LAST matching line, not the last line of
            # output — the count a suite reports last is the one that
            # counts.
            # `|| true` is inert today and deliberate: the pipeline's
            # status is tail's, which is 0 even when grep matched
            # nothing. It only does work if pipefail is ever enabled on
            # this step, where grep's exit 1 would otherwise abort it.
            # Unlike the `|| echo 0` below, which IS load-bearing today —
            # those pipelines end in a grep that returns 1 on no match.
            SUMMARY=$(echo "$OUT" | grep -E 'Results: *[0-9]+ passed, *[0-9]+ failed' | tail -1 || true)
            P=$(echo "$SUMMARY" | grep -oE '[0-9]+ passed' | head -1 | grep -oE '^[0-9]+' || echo 0)
            F=$(echo "$SUMMARY" | grep -oE '[0-9]+ failed' | head -1 | grep -oE '^[0-9]+' || echo 0)
            TOTAL_PASS=$((TOTAL_PASS + ${P:-0}))
            TOTAL_FAIL=$((TOTAL_FAIL + ${F:-0}))
            echo "::endgroup::"
            echo "▸ $s: ${P:-0} passed, ${F:-0} failed (rc=$RC)"
            if [ "$RC" != "0" ] || [ "${F:-0}" != "0" ]; then
              FAILED+=("$s")
            elif [ "${P:-0}" = "0" ] && ! is_empty_allowed "$s"; then
              # rc=0 with no assertions counted. A suite that returned
              # early without asserting anything looks exactly like one
              # that ran and passed, so fail the build rather than let
              # it read as a pass. (The 0 is already in the total above;
              # this is what stops the total being believed.)
              if [ -z "$SUMMARY" ]; then
                echo "::error::$s produced no parsable assertion count: no line matching 'Results: N passed, M failed' — a summary carrying only one of the two counts does not parse"
              else
                echo "::error::$s produced no parsable assertion count: summary line reported 0 passed ($SUMMARY)"
              fi
              FAILED+=("$s")
            fi
          done
          echo ""
          echo "═════════════════════════════════════════"
          echo "TOTAL: $TOTAL_PASS passed, $TOTAL_FAIL failed"
          echo "═════════════════════════════════════════"
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "FAILED SUITES:"
            for s in "${FAILED[@]}"; do echo "  - $s"; done
            exit 1
          fi

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: |
            /tmp/backend.log
            /tmp/embed-stub.log
          if-no-files-found: ignore
