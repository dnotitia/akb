name: "@akb/client Git consumer"

on:
  pull_request:
    paths:
      - "packages/akb-client/**"
      - ".github/workflows/akb-client-git-consumer.yml"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  exact-git-consumer:
    name: Exact @akb/client Git consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - name: Prove exact Git dependency consumer
        env:
          AKB_GIT_REPOSITORY: https://github.com/${{ github.repository }}.git
          AKB_GIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          AKB_GIT_SUBDIRECTORY: packages/akb-client
        run: node packages/akb-client/scripts/prove-git-consumer.mjs
