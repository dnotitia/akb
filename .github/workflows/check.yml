name: check

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs on the same ref — only the latest PR push matters.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis (ruff + tsc + vitest + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Python ─────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          # No cache — the only python deps we need here are listed
          # in the next step; full backend runtime isn't installed.
      - name: Install backend lint/type/sec tools + detect-secrets
        # Exact-pinned to match backend/pyproject.toml [project.optional-dependencies] dev.
        # Floor-only specifiers let a silent dep upgrade flip the same
        # commit's CI from pass→fail (or fail→pass) without anyone
        # noticing — bump these intentionally, in lockstep with pyproject.toml.
        run: pip install 'ruff==0.15.16' 'mypy==2.1.0' 'bandit[toml]==1.9.4' 'detect-secrets==1.5.0'

      # ── Node / pnpm (for tsc + vitest in scripts/check.sh) ────
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            packages/akb-client/pnpm-lock.yaml
      - name: Install stdio proxy deps
        working-directory: packages/akb-mcp-client
        run: npm ci
      - name: Install frontend deps
        working-directory: frontend
        # `--ignore-scripts` skips package postinstall hooks. We don't need
        # them in CI — msw's postinstall registers a browser service-worker
        # bundle that node-only vitest/RTL never touches — and pnpm 10+
        # exits non-zero on any unapproved build script even with
        # `pnpm.onlyBuiltDependencies` set when run via the action.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install @akb/client deps
        working-directory: packages/akb-client
        # Its own pnpm store: typescript + vitest. The package's prepare
        # lifecycle may emit dist/, while the contributor gate runs the
        # explicit build again before its checks.
        run: pnpm install --frozen-lockfile

      # ── Single entry point so CI and local pre-commit stay in sync ──
      - name: Run scripts/check.sh
        run: bash scripts/check.sh

  git-consumer:
    name: Exact @akb/client Git consumer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - name: Prove exact Git dependency consumer
        env:
          AKB_GIT_REPOSITORY: https://github.com/${{ github.repository }}.git
          AKB_GIT_SHA: ${{ github.event.pull_request.head.sha }}
          AKB_GIT_SUBDIRECTORY: packages/akb-client
        run: node packages/akb-client/scripts/prove-git-consumer.mjs
