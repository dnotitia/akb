name: check

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs on the same ref — only the latest PR push matters.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis (ruff + tsc + vitest + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Python ─────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          # No cache — the only python deps we need here are listed
          # in the next step; full backend runtime isn't installed.
      - name: Install backend lint/type/sec tools + detect-secrets
        # Exact-pinned to match backend/pyproject.toml [project.optional-dependencies] dev.
        # Floor-only specifiers let a silent dep upgrade flip the same
        # commit's CI from pass→fail (or fail→pass) without anyone
        # noticing — bump these intentionally, in lockstep with pyproject.toml.
        run: pip install 'ruff==0.15.16' 'mypy==2.1.0' 'bandit[toml]==1.9.4' 'detect-secrets==1.5.0'

      # ── Node / pnpm (for tsc + vitest in scripts/check.sh) ────
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            packages/akb-client/pnpm-lock.yaml
            packages/markdown-editor/pnpm-lock.yaml
      - name: Install stdio proxy deps
        working-directory: packages/akb-mcp-client
        run: npm ci
      - name: Install frontend deps
        working-directory: frontend
        # The Git-pinned @akb/markdown-editor consumer is source-only and
        # needs its resolved artifact's prepare build to create dist/. Keep
        # the repository-scoped allowBuilds list narrow; do not replace this
        # with a global scripts allowance or a local source copy.
        run: |
          npm install --global npm@12.0.2
          pnpm install --frozen-lockfile
      - name: Install @akb/client deps
        working-directory: packages/akb-client
        # Its own pnpm store: typescript + vitest. No postinstall build
        # scripts, so a plain frozen install is enough for `pnpm run build`
        # (tsc emit) and `pnpm exec vitest run` in scripts/check.sh.
        run: pnpm install --frozen-lockfile
      - name: Install Markdown editor deps
        working-directory: packages/markdown-editor
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ── Single entry point so CI and local pre-commit stay in sync ──
      - name: Run scripts/check.sh
        run: bash scripts/check.sh
