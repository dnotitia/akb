name: backend-pytest

# Closes the gap that `check.yml` couldn't: unit tests under
# `backend/tests/test_*.py` import asyncpg, kiwipiepy, etc., so they
# need backend runtime deps installed. Lives in its own workflow so
# the heavy install doesn't slow down the lint/type/vitest gate.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (runtime + dev)
        working-directory: backend
        # From uv.lock, as the backend image and the e2e job install it, so
        # these tests run the versions that ship. The venv's bin goes on PATH
        # for the `pytest` and `python` calls in the steps below.
        run: |
          pip install 'uv==0.12.12'
          uv sync --locked --extra dev --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        working-directory: backend
        # `-k 'not _e2e'` excludes live tests, including the authenticated
        # MCP scenario under tests/mcp_e2e. The repository-owned runtime gate
        # runs that scenario explicitly with its schema-v2 descriptor.
        # Shell e2e suites under tests/*.sh aren't picked up by pytest.
        run: pytest tests/ -k 'not _e2e' -v --tb=short

      - name: Run repository runtime contract tests
        working-directory: backend
        # The filename contains `_e2e`, so the broad unit selector above
        # intentionally excludes it. Keep this explicit so the runtime
        # contract is collected and executed in every PR.
        run: pytest tests/test_e2e_runtime_unit.py tests/test_e2e_backend_unit.py -v --tb=short

  pgvector-e2e:
    # The backend suite against real services: PostgreSQL with pgvector
    # available but not created (the fresh-DB scenario), the BM25 extension
    # server and Redis. The unit job has none of them, so every test that
    # needs a database skips there; this job is where those tests gate.
    #
    # Selection is a rule, not a list. Every test under backend/tests runs
    # here except tests/mcp_e2e, which the repository runtime gate runs, and
    # the tests that declare `@pytest.mark.needs_resource("...")` for
    # something this job does not provide. AKB_TEST_FAIL_ON_SKIP=1 turns any
    # skip or xfail into a failure that names the test and the fix, so a new
    # PostgreSQL-backed test cannot skip here and read as a pass. The rule
    # lives in backend/tests/conftest.py.
    #
    # Caveat: these tests do NOT reproduce the 0.8.3 shared-main-pool
    # `unknown type: public.vector` manifestation — it passes pre-fix in
    # isolation even with a faithful backend-pool replica; the deployed
    # trigger is a startup concurrency race a single-threaded test can't
    # recreate (see backend/CHANGELOG.md 0.8.3). That case is covered by
    # a deploy-time reset-cycle check, not here.
    name: pgvector e2e (live DB)
    runs-on: ubuntu-latest
    env:
      AKB_TEST_FAIL_ON_SKIP: '1'
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: akb
          POSTGRES_PASSWORD: akb  # pragma: allowlist secret
          POSTGRES_DB: akb
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U akb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      # The BM25 index extension, for the VChord test modules. Without this
      # server those tests skip, and AKB_TEST_FAIL_ON_SKIP makes that skip
      # fail the job instead of reading like a pass.
      #
      # It is the image the install paths build, from deploy/postgres: the
      # production pgvector base plus vchord_bm25 compiled with the akb#679,
      # akb#684 and akb#687 fixes. A prebuilt upstream image would test an
      # extension build that no installation runs, and the one this lane used to
      # pull has all three defects.
      #
      # It runs with the plain `postgres` command, as installations do: no
      # `shared_preload_libraries`. Without a preload the extension's settings
      # exist only once a session has called into it, and a preloaded server
      # hid the failure of every new pooled connection's first search
      # (akb#615).
      - name: Build and start the BM25 extension server
        env:
          VCHORD_PASSWORD: akb  # pragma: allowlist secret
        run: |
          docker build --tag akb-postgres:ci deploy/postgres
          docker run -d --name vchord -p 15433:5432 \
            -e POSTGRES_USER=akb -e POSTGRES_PASSWORD="$VCHORD_PASSWORD" -e POSTGRES_DB=akb \
            akb-postgres:ci postgres

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (runtime + dev)
        working-directory: backend
        # From uv.lock, as the backend image and the e2e job install it, so
        # these tests run the versions that ship. The venv's bin goes on PATH
        # for the `pytest` and `python` calls in the steps below.
        run: |
          pip install 'uv==0.12.12'
          uv sync --locked --extra dev --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Create isolated M1 measurement database
        working-directory: backend
        run: |  # pragma: allowlist secret
          python - <<'PY'
          import asyncio

          import asyncpg


          async def main():
              conn = await asyncpg.connect(
                  "postgresql://akb:akb@localhost:15432/akb"  # pragma: allowlist secret
              )
              try:
                  await conn.execute(
                      'CREATE DATABASE "akb_revision_m1_measurement_ci"'
                  )
              finally:
                  await conn.close()


          asyncio.run(main())
          PY

      # Over TCP: while the image initialises it runs a temporary server on
      # the Unix socket only, which would answer a socket probe too early.
      - name: Wait for the BM25 extension server
        run: |
          for _ in $(seq 1 60); do
            docker exec vchord pg_isready -h 127.0.0.1 -U akb -q && exit 0
            sleep 1
          done
          docker logs vchord
          exit 1

      # Full role pruning is cluster-global: run this oracle before any
      # other DB fixture creates managed UUID roles on the same service. Its
      # test declares needs_resource, so the next step deselects it.
      - name: Run exclusive role-prune namespace oracle
        working-directory: backend
        env:
          AKB_TEST_DSN: postgresql://akb:akb@localhost:15432/akb  # pragma: allowlist secret
          AKB_ROLE_CLUSTER_EXCLUSIVE: '1'
          REQUIRE_REAL_PG: '1'
        run: pytest tests/test_role_membership_delta_pg.py -k full_reconcile -v --tb=short

      - name: Run the backend suite against the live services
        working-directory: backend
        env:
          # Matches the fixture default + the dev compose override.
          AKB_TEST_DSN: postgresql://akb:akb@localhost:15432/akb  # pragma: allowlist secret
          AKB_SEARCH_PERF_DSN: postgresql://akb:akb@localhost:15432/akb  # pragma: allowlist secret
          AKB_SEARCH_TEST_DSN: postgresql://akb:akb@localhost:15432/akb  # pragma: allowlist secret
          # Migration 057 is deliberately measurement-database-only. Keep
          # generic DB tests on `akb`, and run the M1 File contract in its
          # isolated disposable database so both safety boundaries execute.
          AKB_M1_FILE_TEST_DSN: postgresql://akb:akb@localhost:15432/akb_revision_m1_measurement_ci  # pragma: allowlist secret
          # Native-ledger correctness must fail if this live-PG gate is
          # accidentally disconnected; a skip here would be a false green.
          REQUIRE_REAL_PG: '1'
          AKB_TEST_REDIS_URL: redis://localhost:16379/0
          REQUIRE_REAL_REDIS: "1"
          # The vchord server started above. The sparse-shape tests create and drop
          # their own database on it, so it is a separate server, not a
          # separate database on the one above.
          AKB_VCHORD_TEST_DSN: postgresql://akb:akb@localhost:15433/akb  # pragma: allowlist secret
        # Why a real database and not a fake connection: these tests assert
        # what PostgreSQL itself does — constraints and composite FKs,
        # triggers, row locks, rollback and cancellation, the catalog after a
        # migration. A fake agrees with whatever SQL it is handed, so those
        # claims are only checked here.
        run: pytest tests/ --ignore=tests/mcp_e2e -m "not needs_resource" -v --tb=short
