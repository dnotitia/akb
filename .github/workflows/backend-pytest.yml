name: backend-pytest

# Closes the gap that `check.yml` couldn't: unit tests under
# `backend/tests/test_*.py` import asyncpg, kiwipiepy, etc., so they
# need backend runtime deps installed. Lives in its own workflow so
# the heavy install doesn't slow down the lint/type/vitest gate.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (runtime + dev)
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run unit tests
        working-directory: backend
        # `-k 'not _e2e'` excludes the two e2e files that need a live
        # backend pod (test_indexable_e2e.py, test_rerank_e2e.py).
        # Shell e2e suites under tests/*.sh aren't picked up by pytest.
        run: pytest tests/ -k 'not _e2e' -v --tb=short

  pgvector-e2e:
    # DB-backed bootstrap tests that the unit job skips (`-k 'not
    # _e2e'`). They need a real Postgres with pgvector *available but
    # not created* — the fresh-DB scenario — so they self-skipped in CI
    # and never ran. This job runs them, guarding the #117-class
    # extension-bootstrap regressions.
    #
    # Caveat: these tests do NOT reproduce the 0.8.3 shared-main-pool
    # `unknown type: public.vector` manifestation — it passes pre-fix in
    # isolation even with a faithful backend-pool replica; the deployed
    # trigger is a startup concurrency race a single-threaded test can't
    # recreate (see backend/CHANGELOG.md 0.8.3). That case is covered by
    # a deploy-time reset-cycle check, not here.
    name: pgvector e2e (live DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: akb
          POSTGRES_PASSWORD: akb  # pragma: allowlist secret
          POSTGRES_DB: akb
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U akb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (runtime + dev)
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Create isolated M1 measurement database
        working-directory: backend
        run: |  # pragma: allowlist secret
          python - <<'PY'
          import asyncio

          import asyncpg


          async def main():
              conn = await asyncpg.connect(
                  "postgresql://akb:akb@localhost:15432/akb"  # pragma: allowlist secret
              )
              try:
                  await conn.execute(
                      'CREATE DATABASE "akb_revision_m1_measurement_ci"'
                  )
              finally:
                  await conn.close()


          asyncio.run(main())
          PY

      - name: Run pgvector DB-backed e2e tests
        working-directory: backend
        env:
          # Matches the fixture default + the dev compose override.
          AKB_TEST_DSN: postgresql://akb:akb@localhost:15432/akb  # pragma: allowlist secret
          # Migration 057 is deliberately measurement-database-only. Keep
          # generic DB tests on `akb`, and run the M1 File contract in its
          # isolated disposable database so both safety boundaries execute.
          AKB_M1_FILE_TEST_DSN: postgresql://akb:akb@localhost:15432/akb_revision_m1_measurement_ci  # pragma: allowlist secret
          # Native-ledger correctness must fail if this live-PG gate is
          # accidentally disconnected; a skip here would be a false green.
          REQUIRE_REAL_PG: '1'
        # #215 declarative-DDL integration tests need a live PG too (index
        # ASC/DESC physical order, migration 037 upgrade path, add-unique-key
        # concurrency race). They skip in the DB-free unit job above, so gate
        # them here where AKB_TEST_DSN is reachable.
        #
        # Idempotent-upload keying belongs here for the same reason and one
        # more: the invariant it protects *is* the `UNIQUE(vault_id, s3_key)`
        # constraint. Asserting that against a mock would only prove the mock
        # agrees with itself, and leaving the file out of this list would let
        # it skip in both jobs — a gate that never fires.
        #
        # Migration 050 is destructive (archives then DROPs `todos`), so its
        # state matrix and its fail-closed guard are pinned against a real PG
        # for the same reason — and so is the account-deletion regression it
        # exists to fix, which no other test exercises positively.
        #
        # The concurrency invariants file lands here because what it asserts
        # is transactional: the publication cleanup helpers must delete inside
        # the caller's TX, or a crash between the two commits orphans a
        # publication row and a public slug then reaches a different
        # document at the reused path. Rollback
        # semantics are the thing under test, so a mock would prove nothing —
        # and off this list the file skips in both jobs.
        #
        # The orphan-write guard belongs here for the same reason. What it
        # asserts is that a write onto a path whose publication outlived its
        # document is REFUSED — and the orphan has to be manufactured through
        # the real publish path, because a publication whose `resource_uri`
        # the test assembled by hand would agree with a guard that assembles
        # it the same wrong way, and the pair would pass while production
        # matched nothing. Only a real database can hold that state.
        #
        # The resolution vault-binding file needs a real PG for the same
        # reason inverted: it manufactures a publication whose `vault_id`
        # disagrees with the vault named in its `resource_uri` and asserts
        # resolution refuses it. That state is two vaults, two documents at
        # one path, and a row the product will not produce — nothing a mock
        # can stand in for.
        #
        # Migration 058's whole product is a database guarantee — a composite
        # FK with ON DELETE CASCADE — so its tests issue raw SQL that bypasses
        # every application-level defence. There is nothing for a mock to
        # stand in for: the assertions are what PostgreSQL does with a DELETE
        # and a cross-vault UPDATE, plus a catalog comparison between a fresh
        # init.sql database and a migrated one. Off this list it skips in both
        # jobs and the schema could drift unnoticed.
        #
        # The external-git cascade file needs a live PG *and* the real git
        # binary: it drives a reconcile over the in-process smart-HTTP git
        # fixture, publishes the mirrored document, then pushes an upstream
        # commit deleting the path and asserts the publication went with it.
        # The delete path it covers is a tree diff, a row lock and a cascade
        # across three tables — mock any of it and the test stops covering the
        # thing that would leak.
        #
        # The native derived-pipeline file drives the real worker/grep
        # contract against migrations 048/053/054's actual constraints
        # (payload placement check, native_derived_heads FKs, the
        # retry_count/next_attempt_at/delivery_outcome columns) — a mock
        # would agree with itself instead of proving the ledger's CHECKs
        # and triggers hold. It was absent from this list with a
        # since-renumbered migration tuple, so it silently self-skipped in
        # both jobs.
        #
        # Recovery-admin provisioning and the dedicated admin browser-session
        # contract are also database guarantees.  Their ordinary unit-job
        # collection intentionally skips without Postgres, so keep both files
        # explicit here: otherwise account uniqueness, exact identity FKs,
        # session concurrency, and the 072 upgrade path would never gate CI.
        run: >
          pytest
          tests/test_pgvector_ext_bootstrap_e2e.py
          tests/test_migration_037_upgrade_unit.py
          tests/test_migration_050_drop_todos_unit.py
          tests/test_migration_058_publication_identity_unit.py
          tests/test_index_order_unit.py
          tests/concurrency/test_alter_unique_race_unit.py
          tests/concurrency/test_native_ledger_b_core.py
          tests/concurrency/test_native_derived_pipeline.py
          tests/test_m1_file_measurement_pg.py
          tests/test_native_revision_m1_payload_placement_migration.py
          tests/concurrency/test_invariants_unit.py
          tests/test_publication_resolution_vault_binding_unit.py
          tests/test_publication_path_claim_guard_unit.py
          tests/test_external_git_cascade_unit.py
          tests/test_file_idempotent_upload_unit.py
          tests/test_app_registry_migration_unit.py
          tests/test_app_identity_postgres.py
          tests/test_app_inventory_postgres.py
          tests/test_app_installation_postgres.py
          tests/test_app_rollout_postgres.py
          tests/test_recovery_admin_provisioning_postgres.py
          tests/test_admin_auth_postgres.py
          tests/test_sso_identity_migration_postgres.py
          tests/test_sso_browser_session_postgres.py
          tests/test_tool_usage_e2e.py
          tests/test_table_if_not_exists_e2e.py
          -v --tb=short
