# Coding-agent roles for this repository: the one source for both agents.
#
#   .codex/config.toml, .codex/agents/*.toml   <- Codex reads these by name
#   .claude/agents/*.md                        <- Claude Code reads these by name
#
# Both views are rendered from this file and committed, so neither agent needs
# a build step; scripts/check.sh fails when a rendered file is hand-edited or
# stale. Edit here, then:
#
#   python scripts/agent-roles.py          # render both views
#   python scripts/agent-roles.py --check  # what scripts/check.sh runs
#
# No model and no reasoning effort is set here or in any rendered file. Each
# person chooses them in their own agent configuration, and every role
# inherits the session's choice. --check rejects a model or effort key in this
# file and in .claude/settings.json. Product inference models (config/app.yaml)
# are a separate concern.

[delegation]
# One level deep, at most three workers at a time. Codex enforces both keys;
# Claude Code subagents cannot nest, so only the count is a convention there.
max_workers = 3
depth = 1

[roles.explorer]
description = "Bounded read-only lookup that returns paths and evidence, not decisions."
read_only = true
instructions = """
Answer the bounded repository question in the assignment. Return the relevant
paths and evidence, with uncertainties. Do not edit or initiate release work.
Leave coupled reasoning and final decisions to the session that asked.
"""

[roles.reviewer]
description = "Read-only review of a named diff with concrete, reproducible findings."
read_only = true
instructions = """
Review the named diff and relevant callers against the intended behavior.
Report reachable defects with evidence and a useful fix; discard unsupported
suspicions. Identify the reviewed commit and checks so the requester can reuse
them. Match review depth to the change and avoid repeating completed
verification.
"""

[roles.worker]
description = "Bounded implementation on assigned paths, returning the change and the check it ran."
read_only = false
instructions = """
Work only on the assigned paths and outcome. Run the check that exercises the
change, and return the change, the check's result and any uncertainty. If the
assignment is ambiguous, return it with the question instead of guessing. The
session that delegated integrates the result and handles releases.
"""
