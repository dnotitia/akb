services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: akb
      POSTGRES_PASSWORD: akb
      POSTGRES_DB: akb
    ports:
      - "${AKB_E2E_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akb -d akb"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: akb-ci
      MINIO_ROOT_PASSWORD: akb-ci-secret
    ports:
      - "${AKB_E2E_MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  minio_data:
